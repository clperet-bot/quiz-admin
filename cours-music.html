<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music &amp; Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="music-data.js"></script>
<style>
  :root{
    --ink:#1B1F2A; --ink-soft:#5A6072; --line:#E4E0F3; --paper:#F4F2FB; --white:#fff;
    --violet:#7B5FE0; --violet-deep:#3D2B66; --violet-light:#EFEAFC;
    --blue:#4C8DF6; --blue-light:#E5EFFF;
    --green:#2E8B57; --green-bg:#E6F6EA; --green-head:#8FD19E;
    --yellow-bg:#FFF7CF; --yellow-head:#FFE97F; --yellow-ink:#6B5300;
    --pink-bg:#FDEAF1; --pink-head:#EE9DBA; --pink-ink:#7A1F45;
    --red:#C0392B; --red-bg:#FDE9E6; --amber-bg:#FFF1C9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Poppins',system-ui,sans-serif;font-size:16px;line-height:1.6;color:var(--ink);background:var(--paper);-webkit-text-size-adjust:100%;}
  img{max-width:100%;display:block;}
  button{font-family:inherit;}
  .hidden{display:none !important;}

  .topbar{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,var(--violet-deep),var(--violet));color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;}
  .topbar .brand{font-weight:700;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar .who{font-size:14px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw;}
  .topbar button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;cursor:pointer;}
  .sync-warn{background:var(--amber-bg);color:#6B4B00;font-size:14px;text-align:center;padding:6px 12px;}
  .wrap{max-width:940px;margin:0 auto;padding:18px 16px 60px;}

  .id-card{max-width:520px;margin:24px auto;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 8px 30px rgba(61,43,102,.12);}
  .id-card .banner{height:120px;background:linear-gradient(110deg,var(--blue),var(--violet));display:flex;align-items:center;justify-content:center;font-size:56px;}
  .id-card .body{padding:22px 24px 26px;}
  .id-card h1{font-size:22px;margin:0 0 2px;color:var(--violet-deep);}
  .id-card p.sub{margin:0 0 18px;color:var(--ink-soft);font-size:15px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:14px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input,.field select{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font:inherit;font-size:16px;background:#fff;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--violet);}
  .btn{background:var(--violet);color:#fff;border:0;border-radius:14px;padding:13px 22px;font-weight:600;font-size:16px;cursor:pointer;}
  .btn:disabled{opacity:.55;cursor:default;}
  .btn.block{width:100%;}
  .btn.ghost{background:var(--violet-light);color:var(--violet-deep);}
  .btn.green{background:var(--green);}
  .btn.small{padding:8px 14px;font-size:15px;border-radius:12px;}
  .btn.rec{background:#D8334A;}
  .err{background:var(--red-bg);color:var(--red);border-radius:12px;padding:10px 14px;font-size:15px;margin-top:12px;}

  .hero{border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 8px 30px rgba(61,43,102,.10);}
  .hero .band{background:linear-gradient(110deg,var(--blue),var(--violet));color:#fff;padding:22px 26px;}
  .hero .band h1{margin:0;font-size:clamp(24px,5vw,34px);line-height:1.2;}
  .hero .band p{margin:4px 0 0;font-weight:500;opacity:.95;}
  .hero .in{padding:16px 26px 22px;font-size:15.5px;}
  .hero ul{margin:8px 0 0;padding-left:20px;}
  .roadmap{margin-top:22px;display:flex;flex-direction:column;gap:12px;}
  .rm-row{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .rm-row.locked{cursor:not-allowed;opacity:.55;}
  .badge-n{flex:none;width:52px;height:52px;border-radius:50%;border:3px solid var(--violet);background:#fff;color:var(--violet);font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center;}
  .badge-n.done{background:var(--green);border-color:var(--green);color:#fff;}
  .rm-ribbon{flex:1;background:#fff;border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 3px 14px rgba(61,43,102,.08);border-left:8px solid var(--blue);}
  .rm-row.done .rm-ribbon{border-left-color:var(--green);}
  .rm-ribbon .ti{font-weight:700;font-size:17px;flex:1;min-width:150px;}
  .pill{display:inline-block;background:var(--violet-light);color:var(--violet-deep);font-size:13px;font-weight:600;padding:3px 11px;border-radius:999px;white-space:nowrap;}
  .pill.ok{background:var(--green-bg);color:var(--green);} .pill.prog{background:var(--blue-light);color:#1F5BB8;}

  .step-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .step-head .ribbon{flex:1;background:linear-gradient(100deg,var(--blue),var(--violet));color:#fff;border-radius:16px;padding:12px 18px;font-weight:700;font-size:clamp(18px,4vw,24px);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .step-head .ribbon .pill{background:rgba(255,255,255,.22);color:#fff;font-size:12.5px;margin-left:auto;}
  .goal{background:#fff;border-left:6px solid var(--blue);border-radius:14px;padding:12px 16px;margin-bottom:14px;font-size:15.5px;}
  .box{background:#fff;border-radius:16px;padding:14px 18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(61,43,102,.06);}
  .box h3{margin:0 0 8px;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--violet-deep);}
  .box.how ol{margin:6px 0 0;padding-left:22px;}
  .box.warm{background:#FCE9DF;}
  details.vocab{background:#FCE9DF;border-radius:16px;padding:10px 18px;margin-bottom:14px;}
  details.vocab summary{cursor:pointer;font-weight:700;color:#6B3410;}
  .bank-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 18px;font-size:15.5px;margin:8px 0 10px;}
  .bank-grid b{color:#6B3410;} .vh{font-weight:700;margin-top:8px;color:#6B3410;}

  .done-banner{background:var(--green);color:#fff;border-radius:16px;padding:14px 18px;margin:6px 0 16px;font-weight:600;}
  .done-banner span{display:block;font-weight:400;font-size:15px;margin-top:2px;}
  .lu-remind{background:#fff;border:2px solid var(--violet);border-radius:16px;padding:12px 16px;margin:0 0 16px;font-size:15.5px;}
  .lu-remind b{color:var(--violet-deep);}
  .lu-remind a{display:inline-block;margin-top:8px;background:var(--violet);color:#fff;text-decoration:none;font-weight:600;border-radius:12px;padding:8px 16px;}
  .step-nav{display:flex;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap;}

  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px;}
  .lvlnext{background:var(--green-bg);border:2px solid #9bd8b4;border-radius:14px;padding:12px 16px;margin:12px 0;font-size:15.5px;} .lvlnext-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .spk{background:var(--blue-light);border:0;border-radius:50%;width:30px;height:30px;margin-right:8px;cursor:pointer;font-size:15px;vertical-align:middle;flex:none;}
  .wbank div{min-width:0;} @media (max-width:480px){ .wbank{grid-template-columns:1fr !important;} } .wbank{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px;margin-top:6px;} .wbank i{color:var(--ink-soft);}
  .gram{background:var(--blue-light);border:2px solid var(--blue);border-radius:14px;padding:10px 14px;margin:0 0 12px;} .gram summary{cursor:pointer;font-weight:700;color:var(--violet-deep);} .gram-in{padding-top:8px;font-size:15.5px;} .gram-in p{margin:6px 0;} .gfix{color:#17603a;font-weight:600;}
  .lvlfail{background:#FFF1F3;border-color:#F2A7B3;}
  .lvlpick{margin:4px 0 0;font-size:15.5px;color:var(--violet-deep);}
  .tab{flex:1;min-width:140px;border:2px solid transparent;border-radius:14px;padding:10px 12px;cursor:pointer;font-weight:600;font-size:15px;text-align:left;line-height:1.3;}
  .tab small{display:block;font-weight:500;font-size:13px;opacity:.85;}
  .tab.A{background:var(--green-bg);color:#17603a;} .tab.B{background:var(--yellow-bg);color:var(--yellow-ink);} .tab.C{background:var(--pink-bg);color:var(--pink-ink);}
  .tab.active{border-color:currentColor;box-shadow:0 3px 12px rgba(0,0,0,.10);}
  .lvl{border-radius:20px;overflow:hidden;margin-bottom:16px;}
  .lvl.A{background:var(--green-bg);} .lvl.B{background:var(--yellow-bg);} .lvl.C{background:var(--pink-bg);}
  .lvl-head{display:flex;align-items:center;gap:12px;padding:12px 18px;font-weight:700;font-size:17px;}
  .lvl.A .lvl-head{background:var(--green-head);color:#0f3d24;} .lvl.B .lvl-head{background:var(--yellow-head);color:var(--yellow-ink);} .lvl.C .lvl-head{background:var(--pink-head);color:#4a0f2a;}
  .lvl-head .lt{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;}
  .lvl-head .tag{margin-left:auto;font-size:13px;font-weight:600;opacity:.8;text-align:right;}
  .lvl-body{padding:16px 18px 6px;}

  .q{background:#fff;border-radius:16px;padding:14px 16px 16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
  .q.done{border:2px solid #cdebd6;} .q.done.wrong{border-color:#f3c9c2;}
  .q-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;}
  .q-n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--violet);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .q.done .q-n{background:var(--green);} .q.done.wrong .q-n{background:#c78a82;}
  .q-p{font-weight:600;font-size:16px;} .q-p small{display:block;font-weight:400;color:var(--ink-soft);font-size:14.5px;margin-top:2px;}
  .indent{margin-left:40px;}
  .q textarea,.fld textarea,.fld input[type=text]{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;font:inherit;font-size:16px;background:#fff;resize:vertical;}
  .keys{margin:0 0 8px 40px;font-size:14.5px;background:#F8F7FD;border-radius:12px;padding:8px 12px;color:var(--ink-soft);}
  .keys b{color:var(--violet-deep);}
  .q-actions{margin:10px 0 0 40px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .q-actions .btn{padding:10px 20px;font-size:15px;border-radius:12px;}
  .fb{margin:12px 0 0 40px;border-radius:12px;padding:10px 14px;font-size:15.5px;line-height:1.5;}
  .fb.ok{background:var(--green-bg);color:#17603a;} .fb.ko{background:var(--red-bg);color:#8a2a1f;} .fb.info{background:var(--blue-light);color:#1F4F9E;} .fb.warn{background:var(--amber-bg);color:#6B4B00;}
  .corr{margin:10px 0 0 40px;background:#F8F7FD;border-radius:12px;padding:8px 12px;font-size:15.5px;white-space:pre-wrap;}
  .corr small{display:block;color:var(--ink-soft);font-weight:600;font-size:13px;}
  .fld{margin:0 0 10px;} .fld label{display:block;font-size:14px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
  .fld.chk label{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;color:var(--ink);font-weight:500;}
  .fld.chk input{width:20px;height:20px;margin-top:3px;}

  /* carte mentale */
  .map{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0;}
  .map .center{grid-column:1/-1;justify-self:center;border:3px solid var(--violet);border-radius:50%/60%;padding:14px 32px;background:var(--violet-light);font-weight:700;text-align:center;}
  .map .br{border-radius:16px;padding:10px 12px;border:2px solid var(--line);background:#fff;}
  .map .br.c0{background:#FDEAF1;border-color:#f5cfdd;} .map .br.c1{background:#FFF1E4;border-color:#f6d9bd;}
  .map .br.c2{background:#FFF7CF;border-color:#f0e4a4;} .map .br.c3{background:#E6F6EA;border-color:#cdebd6;}
  .map .br.c4{background:#E5EFFF;border-color:#cfe0fb;} .map .br.c5{background:#EFEAFC;border-color:#d4c8fa;}
  .map .br.miss{border-color:var(--red);}
  .map label{display:block;font-weight:700;font-size:15px;margin-bottom:4px;}
  .map textarea{width:100%;border:2px solid rgba(0,0,0,.08);border-radius:10px;padding:8px 10px;font:inherit;font-size:16px;resize:vertical;background:#fff;}
  .map .ro{background:#fff;border-radius:10px;padding:8px 10px;min-height:44px;white-space:pre-wrap;}
  .src-row{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0;}
  .preview{max-height:300px;border-radius:14px;margin:10px 0;border:2px solid var(--line);}
  .chg{background:#fff;border-radius:12px;border:1px solid var(--line);padding:8px 12px;margin-bottom:8px;font-size:15px;}
  .chg .arrow{color:var(--ink-soft);} .chg s{color:#b04a3f;} .chg b{color:var(--green);}
  .chg small{display:block;color:var(--ink-soft);}

  /* prononciation */
  .words{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;}
  .wcard{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;min-width:150px;}
  .wcard b{font-size:17px;} .wcard .ipa{color:var(--ink-soft);font-size:14.5px;} .wcard .say{font-weight:600;color:var(--violet-deep);} .wcard .tip{font-size:14px;color:var(--ink-soft);}
  .sent{font-size:18px;line-height:2;margin:4px 0 8px;}
  .tok{padding:1px 3px;border-radius:6px;cursor:pointer;}
  .tok:hover{background:var(--violet-light);}
  .tok.good{background:var(--green-bg);color:#17603a;} .tok.bad{background:#FFE7C2;color:#7a4300;}
  .row-btns{display:flex;gap:8px;flex-wrap:wrap;}
  .meter{height:8px;border-radius:6px;background:#EEEAF8;overflow:hidden;margin-top:6px;} .meter i{display:block;height:100%;background:var(--green);}

  /* enregistrement */
  .recbox{background:#F8F7FD;border-radius:14px;padding:12px 14px;margin:10px 0;}
  .recbox audio{width:100%;margin-top:8px;}
  .timer{font-weight:700;font-variant-numeric:tabular-nums;margin-left:6px;}
  .readtext{background:#fff;border:2px dashed var(--line);border-radius:14px;padding:12px 16px;font-size:18px;line-height:1.9;white-space:pre-wrap;margin:8px 0;}

  .finish{background:#fff;border-radius:22px;padding:26px;text-align:center;box-shadow:0 8px 30px rgba(61,43,102,.12);margin-top:18px;}
  .finish h2{margin:0 0 6px;color:var(--violet-deep);}

  @media (max-width:640px){
    .hero .band{padding:18px;} .hero .in{padding:12px 18px 18px;}
    .indent,.keys,.q-actions,.fb,.corr{margin-left:0;}
    .map{grid-template-columns:1fr;} .lvl-head .tag{display:none;}
  }

  .yn{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 4px;}
  .yn button{flex:1;min-width:130px;border:3px solid var(--line);background:#fff;border-radius:16px;padding:14px;font-size:18px;font-weight:700;cursor:pointer;}
  .yn button.sel.yes{border-color:var(--green);background:var(--green-bg);color:#17603a;}
  .yn button.sel.no{border-color:var(--pink-head);background:var(--pink-bg);color:var(--pink-ink);}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0;}
  .pair figure{margin:0;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center;}
  .pair img{max-height:300px;margin:0 auto;border-radius:8px;} .pair figcaption{font-weight:700;font-size:14px;margin-top:6px;color:var(--violet-deep);}
  .pairpick{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;} .pairpick button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-weight:600;font-size:14.5px;cursor:pointer;} .pairpick button.sel{border-color:var(--violet);background:var(--violet-light);}
  .check-list{margin:8px 0 0;padding-left:0;list-style:none;} .check-list li{padding:8px 12px;margin-bottom:6px;background:#F8F7FD;border-radius:12px;}
  .arena{background:linear-gradient(110deg,var(--violet-deep),var(--violet));color:#fff;border-radius:18px;padding:16px 20px;margin-bottom:14px;}
  .arena a.go{display:inline-block;background:#fff;color:var(--violet-deep);font-weight:700;text-decoration:none;border-radius:12px;padding:10px 18px;margin:8px 8px 0 0;}
  .frames{background:#FFF7CF;border-radius:14px;padding:10px 16px;margin:8px 0;font-size:15.5px;} .frames div{margin:3px 0;}
  @media (max-width:640px){ .pair{grid-template-columns:1fr;} }

  .gap{padding:6px 8px;border:2px solid var(--line);border-radius:10px;font:inherit;font-size:15.5px;background:#fff;max-width:100%;margin:2px 2px;}
  .gap.good{border-color:var(--green);background:var(--green-bg);} .gap.bad{border-color:var(--red);background:var(--red-bg);}
  .sentline{margin:0 0 12px;line-height:2.1;font-size:16px;}
  .rev{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px;}
  .rev .hd{display:flex;justify-content:space-between;gap:8px;font-weight:700;} .rev .st{color:#C0392B;letter-spacing:2px;} .rev p{margin:4px 0 0;font-size:15.5px;}
  .choice{display:block;width:100%;text-align:left;border:3px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px;font-size:16.5px;font-weight:600;cursor:pointer;}
  .choice.sel{border-color:var(--violet);background:var(--violet-light);}
  .tbl{width:100%;border-collapse:collapse;font-size:15px;} .tbl th{background:#C0143C;color:#fff;padding:8px;text-align:left;} .tbl td{border:1px solid var(--line);padding:6px;vertical-align:top;} .tbl select{width:100%;}
  .art{background:#fff;border-radius:14px;padding:12px 18px;margin-bottom:12px;border-left:6px solid var(--blue);font-size:16.5px;line-height:1.75;} .art p{margin:0 0 10px;}
  .counter{font-weight:700;color:var(--violet-deep);margin:6px 0;} .counter.ok{color:var(--green);}
  .frm{margin:0 0 8px;} .frm label{display:block;font-weight:600;font-size:15px;margin-bottom:3px;}
  .frm input[type=text],.fld input[type=text]{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;font:inherit;font-size:16px;}
  .rolegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin:8px 0;}
  .rolecard{background:#F8F7FD;border-radius:12px;padding:8px 12px;font-size:14.5px;} .rolecard b{display:block;color:var(--violet-deep);}
  .typegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:8px 0;}
  .typecard{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:15px;} .typecard b{display:block;font-size:16.5px;color:var(--violet-deep);margin-bottom:4px;}
  .tip5{display:flex;gap:12px;align-items:flex-start;margin:0 0 10px;} .tip5 .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .fr{background:#EEF4FF;border-left:4px solid var(--blue);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:15px;line-height:1.5;}
  .trbtn{background:#fff;border:2px solid var(--blue);color:var(--blue);border-radius:999px;padding:6px 14px;font:600 14px/1 inherit;font-family:inherit;cursor:pointer;margin:8px 0 0;}
  .frti{display:block;font-weight:500;font-size:13px;opacity:.85;} .frhead{margin:-6px 0 10px 54px;font-size:14px;color:var(--ink-soft);}
  .mailmodel{background:#fff;border:2px dashed var(--line);border-radius:14px;padding:10px 14px;margin:8px 0;}
  .mailmodel .part{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px;} .mailmodel .part:last-child{border:0;}
  .mailmodel .part b{color:var(--violet-deep);font-size:13.5px;} .mailmodel .part div{white-space:pre-wrap;}

  const a = arr.slice(); let s = (seed * 2654435761) >>> 0;
  const rnd = () => { s += 0x6D2B79F5; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function levelTabs(levels, counts, redraw, n){
  return h('div', {class:'tabs'}, ['A','B','C'].map(L => { const open = levelOpen(n, L); return h('button', {type:'button', class:'tab ' + L + (curLevel === L ? ' active' : ''), disabled:!open, style:open ? '' : 'opacity:.5;cursor:not-allowed', title:open ? '' : 'Termine d\'abord le niveau précédent', onclick:() => { if(!open) return; curLevel = L; redraw(); }},
    (open ? '' : '🔒 ') + 'TRACK ' + L + ' · ' + levels[L].title, h('small', null, (counts[L] ? '✅ ' : levelFailed(n, L) ? '🔁 ' : '') + (counts[L] ? 'terminé' : levelFailed(n, L) ? 'à refaire' : open ? levels[L].tag : 'termine le niveau d\'avant'))); }));
}
// Petit point de grammaire (niveau C) : explication + mini-activité d'auto-vérification
function grammarBox(n){
  const G = window.MUSIC_GRAMMAR && window.MUSIC_GRAMMAR[n]; if(!G) return null;
  const sels = G.check.map((it, i) => ({ it, s:mkSelect(shuffled(it.opts, n * 31 + i)), fix:h('span', {class:'gfix'}) }));
  const res = h('div', {class:'fb hidden', style:'margin:10px 0 0'});
  const btn = h('button', {class:'btn', type:'button', style:'margin-top:8px', onclick:() => {
    if(sels.some(x => !x.s.value)){ res.className = 'fb warn'; res.textContent = 'Réponds à toutes les phrases 🙂'; return; }
    let ok = 0; sels.forEach(({it, s, fix}) => { const good = s.value === it.opts[it.ans]; if(good) ok++; s.style.borderColor = good ? 'var(--green)' : '#e0556b'; fix.textContent = good ? ' ✓' : ' → ' + it.opts[it.ans]; });
    res.className = 'fb ' + (ok === sels.length ? 'ok' : 'info'); res.textContent = ok === sels.length ? '🎉 Parfait ! Tu maîtrises ce point, tu peux écrire ton texte.' : ok + ' / ' + sels.length + ' — regarde les corrections en vert, relis la règle et réessaie.';
  }}, 'Vérifier');
  return h('details', {class:'gram'}, h('summary', null, '📘 Petit point de grammaire : ' + G.title),
    h('div', {class:'gram-in'},
      G.rules.map(([t, d]) => h('p', null, h('b', null, t + ' '), d)),
      h('div', {class:'fr', style:'display:block'}, G.examples.map(([en, fr]) => h('div', null, spk(en), h('b', null, en), ' ', h('i', null, '(' + fr + ')')))),
      h('p', {style:'margin:8px 0 2px'}, h('b', null, (G.verbsLabel || 'Verbes utiles') + ' : '), G.verbs.map(([en, fr]) => en + ' (' + fr + ')').join(' · ')),
      h('h4', {style:'margin:14px 0 6px'}, '✏️ À toi de jouer — choisis la bonne forme'),
      sels.map(({it, s, fix}, i) => h('div', {class:'sentline'}, (i + 1) + '. ', it.q.split('___')[0], s, it.q.split('___')[1] || '', fix)),
      btn, res));
}
function viewStep(n, body){
  const S0 = D.STEPS[n - 1], st = C.steps[n - 1];
  const tabsHost = h('div'); body.append(h('div', {class:'lvlpick'}, h('b', null, '👇 Ton parcours : '), 'les 3 niveaux sont obligatoires, dans l\'ordre A → B → C.'), tabsHost);

  const modelFr = h('div', {class:'fr'}, FR.model[n - 1].map((l, i) => h('div', null, h('b', null, S0.model[i][0] + ' : '), l)));

  if(S0.read){ const readFr = h('div', {class:'fr'}, FR.read[n]); body.append(h('div', {class:'box'}, h('h3', null, '📖 Read the directions'), h('div', {class:'art'}, h('p', null, S0.read)), h('div', null, h('button', {type:'button', class:'trbtn', style:'margin-right:8px', onclick:() => say(S0.read, 0.8)}, '🔊 Écouter le texte'), trBtn(readFr)), readFr)); }
  if(S0.plan){ const planFr = h('div', {class:'fr'}, FR.plan.map(([t, x]) => h('div', null, h('b', null, t + ' : '), x)));
    body.append(h('div', {class:'box planbox'}, h('h3', null, '📋 My plan'), h('div', {class:'planlist'}, S0.plan.map(([t, x], i) => h('div', {class:'planrow'}, h('b', {class:'plt'}, t), h('span', null, x)))), h('div', null, trBtn(planFr)), planFr)); }
  const host = h('div'); body.append(host);
  const draw = () => {
    const cnt = {A:levelDone(n, 'A'), B:levelDone(n, 'B'), C:levelDone(n, 'C')};
    const id = n + curLevel + '-1'; const q = {id, step:n, level:curLevel, prompt:st.levels[curLevel].qs[0].prompt};
    let card;
    if(curLevel === 'A'){
      const items = S0.A.items.map((it, i) => ({q:it.q, opts:shuffled(it.opts, n * 100 + i), exp:it.opts[it.ans]}));
      card = quiz(q, 'Choose the best answer', 'Pour chaque situation, choisis la bonne phrase.', items, () => draw());
      // quiz() rafraîchit la barre d'étape ; on redessine aussi les onglets
    } else if(curLevel === 'B'){
      const exp = []; S0.B.lines.forEach(l => l.forEach(p => { if(typeof p !== 'string') exp.push(p.a); }));
      const bank = shuffled(S0.B.bank, n * 7);
      card = detCard(q, 'Complete the text', 'Choisis le bon mot dans la liste pour chaque phrase.', sels => h('div', null,
        h('div', {class:'frames'}, h('b', null, 'Word list'), h('div', {class:'wbank'}, bank.map(([en, fr]) => h('div', null, h('b', null, en), ' ', h('i', null, '(' + fr + ')'))))),
        S0.B.lines.map(line => h('div', {class:'sentline'}, line.map(p => { if(typeof p === 'string') return p; const s = mkSelect(bank.map(b => b[0])); sels.push(s); return s; })))),
        exp, vals => { let i = 0; return S0.B.lines.map(line => line.map(p => typeof p === 'string' ? p : vals[i++]).join('')).join('\n'); }, () => draw());
    } else {
      // Étape finale : on pré-remplit (modifiable) avec les textes C des étapes précédentes (réponse corrigée si elle existe)
      let init = '', missing = 0;
      if(S0.C.prefillFrom){ const parts = S0.C.prefillFrom.map(k => { const p = STATE[k + 'C-1']; if(!p || !p.answer) return ''; const c = p.extra && p.extra.corrected; return String((p.correct !== false && c) ? c : p.answer).trim(); }); missing = parts.filter(x => !x).length; init = parts.filter(Boolean).join('\n\n'); }
      const ta = taNode(init ? 18 : 12, S0.C.ph, init);
      const taBox = init ? h('div', null, h('div', {class:'prefill-note'}, '✍️ Tes textes des étapes 1 à 4 sont déjà là. Ajoute ton introduction au début, ta conclusion et ta question à la fin, puis relis et améliore.' + (missing ? ' Il manque ' + missing + ' partie' + (missing > 1 ? 's' : '') + ' : écris-' + (missing > 1 ? 'les' : 'la') + ' toi-même en suivant le plan.' : '')), ta) : ta;
      card = aiCard({ q, title:S0.C.title, instruct:S0.C.instruct, node:taBox, getText:() => ta.value.trim(), setDisabled:v => ta.disabled = v, rubric:S0.C.rubric, minWords:S0.C.minWords, wantCorrected:true, emptyMsg:'Écris d\'abord ton texte 🙂', onDone:() => draw() });

      h('div', {class:'lvlnext-btns'}, h('button', {class:'btn', type:'button', onclick:() => { resetLevel(n, curLevel); draw(); window.scrollTo(0, 0); }}, '🔁 Refaire ce niveau'))) : levelDone(n, curLevel) ? h('div', {class:'lvlnext'}, h('b', null, '🎉 Niveau ' + curLevel + ' terminé !'),
      stepDone(n) ? h('div', null, 'Bravo, tu as fait les 3 niveaux : l\'étape est validée.') : h('div', null, 'Ce n\'est pas fini : il te reste le niveau ' + ['A','B','C'].filter(L => !levelDone(n, L)).join(' et ') + '.'),
      h('div', {class:'lvlnext-btns'}, stepDone(n) ? nextStepBtn : (nextLvl ? h('button', {class:'btn', type:'button', onclick:() => { curLevel = nextLvl; draw(); window.scrollTo(0, 0); }}, nextLvl === 'B' ? '🎸 Passer au niveau B →' : nextLvl === 'C' ? '🎤 Passer au niveau C →' : '🎧 Faire le niveau A →') : null))) : null;
