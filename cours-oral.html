<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Préparer mon oral — Bakery sign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="oral-data.js"></script>
<style>
  :root{
    --ink:#1B1F2A; --ink-soft:#5A6072; --line:#E4E0F3; --paper:#F4F2FB; --white:#fff;
    --violet:#7B5FE0; --violet-deep:#3D2B66; --violet-light:#EFEAFC;
    --blue:#4C8DF6; --blue-light:#E5EFFF;
    --green:#2E8B57; --green-bg:#E6F6EA; --green-head:#8FD19E;
    --yellow-bg:#FFF7CF; --yellow-head:#FFE97F; --yellow-ink:#6B5300;
    --pink-bg:#FDEAF1; --pink-head:#EE9DBA; --pink-ink:#7A1F45;
    --red:#C0392B; --red-bg:#FDE9E6; --amber-bg:#FFF1C9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Poppins',system-ui,sans-serif;font-size:16px;line-height:1.6;color:var(--ink);background:var(--paper);-webkit-text-size-adjust:100%;}
  img{max-width:100%;display:block;}
  button{font-family:inherit;}
  .hidden{display:none !important;}

  .topbar{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,var(--violet-deep),var(--violet));color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;}
  .topbar .brand{font-weight:700;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar .who{font-size:14px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw;}
  .topbar button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;cursor:pointer;}
  .sync-warn{background:var(--amber-bg);color:#6B4B00;font-size:14px;text-align:center;padding:6px 12px;}
  .wrap{max-width:940px;margin:0 auto;padding:18px 16px 60px;}

  .id-card{max-width:520px;margin:24px auto;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 8px 30px rgba(61,43,102,.12);}
  .id-card .banner{height:120px;background:linear-gradient(110deg,var(--blue),var(--violet));display:flex;align-items:center;justify-content:center;font-size:56px;}
  .id-card .body{padding:22px 24px 26px;}
  .id-card h1{font-size:22px;margin:0 0 2px;color:var(--violet-deep);}
  .id-card p.sub{margin:0 0 18px;color:var(--ink-soft);font-size:15px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:14px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input,.field select{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font:inherit;font-size:16px;background:#fff;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--violet);}
  .btn{background:var(--violet);color:#fff;border:0;border-radius:14px;padding:13px 22px;font-weight:600;font-size:16px;cursor:pointer;}
  .btn:disabled{opacity:.55;cursor:default;}
  .btn.block{width:100%;}
  .btn.ghost{background:var(--violet-light);color:var(--violet-deep);}
  .btn.green{background:var(--green);}
  .btn.small{padding:8px 14px;font-size:15px;border-radius:12px;}
  .btn.rec{background:#D8334A;}
  .err{background:var(--red-bg);color:var(--red);border-radius:12px;padding:10px 14px;font-size:15px;margin-top:12px;}

  .hero{border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 8px 30px rgba(61,43,102,.10);}
  .hero .band{background:linear-gradient(110deg,var(--blue),var(--violet));color:#fff;padding:22px 26px;}
  .hero .band h1{margin:0;font-size:clamp(24px,5vw,34px);line-height:1.2;}
  .hero .band p{margin:4px 0 0;font-weight:500;opacity:.95;}
  .hero .in{padding:16px 26px 22px;font-size:15.5px;}
  .hero ul{margin:8px 0 0;padding-left:20px;}
  .roadmap{margin-top:22px;display:flex;flex-direction:column;gap:12px;}
  .rm-row{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .rm-row.locked{cursor:not-allowed;opacity:.55;}
  .badge-n{flex:none;width:52px;height:52px;border-radius:50%;border:3px solid var(--violet);background:#fff;color:var(--violet);font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center;}
  .badge-n.done{background:var(--green);border-color:var(--green);color:#fff;}
  .rm-ribbon{flex:1;background:#fff;border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 3px 14px rgba(61,43,102,.08);border-left:8px solid var(--blue);}
  .rm-row.done .rm-ribbon{border-left-color:var(--green);}
  .rm-ribbon .ti{font-weight:700;font-size:17px;flex:1;min-width:150px;}
  .pill{display:inline-block;background:var(--violet-light);color:var(--violet-deep);font-size:13px;font-weight:600;padding:3px 11px;border-radius:999px;white-space:nowrap;}
  .pill.ok{background:var(--green-bg);color:var(--green);} .pill.prog{background:var(--blue-light);color:#1F5BB8;}

  .step-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .step-head .ribbon{flex:1;background:linear-gradient(100deg,var(--blue),var(--violet));color:#fff;border-radius:16px;padding:12px 18px;font-weight:700;font-size:clamp(18px,4vw,24px);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .step-head .ribbon .pill{background:rgba(255,255,255,.22);color:#fff;font-size:12.5px;margin-left:auto;}
  .goal{background:#fff;border-left:6px solid var(--blue);border-radius:14px;padding:12px 16px;margin-bottom:14px;font-size:15.5px;}
  .box{background:#fff;border-radius:16px;padding:14px 18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(61,43,102,.06);}
  .box h3{margin:0 0 8px;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--violet-deep);}
  .box.how ol{margin:6px 0 0;padding-left:22px;}
  .box.warm{background:#FCE9DF;}
  details.vocab{background:#FCE9DF;border-radius:16px;padding:10px 18px;margin-bottom:14px;}
  details.vocab summary{cursor:pointer;font-weight:700;color:#6B3410;}
  .bank-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 18px;font-size:15.5px;margin:8px 0 10px;}
  .bank-grid b{color:#6B3410;} .vh{font-weight:700;margin-top:8px;color:#6B3410;}

  .done-banner{background:var(--green);color:#fff;border-radius:16px;padding:14px 18px;margin:6px 0 16px;font-weight:600;}
  .done-banner span{display:block;font-weight:400;font-size:15px;margin-top:2px;}
  .lu-remind{background:#fff;border:2px solid var(--violet);border-radius:16px;padding:12px 16px;margin:0 0 16px;font-size:15.5px;}
  .lu-remind b{color:var(--violet-deep);}
  .lu-remind a{display:inline-block;margin-top:8px;background:var(--violet);color:#fff;text-decoration:none;font-weight:600;border-radius:12px;padding:8px 16px;}
  .step-nav{display:flex;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap;}

  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px;}
  .tab{flex:1;min-width:140px;border:2px solid transparent;border-radius:14px;padding:10px 12px;cursor:pointer;font-weight:600;font-size:15px;text-align:left;line-height:1.3;}
  .tab small{display:block;font-weight:500;font-size:13px;opacity:.85;}
  .tab.A{background:var(--green-bg);color:#17603a;} .tab.B{background:var(--yellow-bg);color:var(--yellow-ink);} .tab.C{background:var(--pink-bg);color:var(--pink-ink);}
  .tab.active{border-color:currentColor;box-shadow:0 3px 12px rgba(0,0,0,.10);}
  .lvl{border-radius:20px;overflow:hidden;margin-bottom:16px;}
  .lvl.A{background:var(--green-bg);} .lvl.B{background:var(--yellow-bg);} .lvl.C{background:var(--pink-bg);}
  .lvl-head{display:flex;align-items:center;gap:12px;padding:12px 18px;font-weight:700;font-size:17px;}
  .lvl.A .lvl-head{background:var(--green-head);color:#0f3d24;} .lvl.B .lvl-head{background:var(--yellow-head);color:var(--yellow-ink);} .lvl.C .lvl-head{background:var(--pink-head);color:#4a0f2a;}
  .lvl-head .lt{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;}
  .lvl-head .tag{margin-left:auto;font-size:13px;font-weight:600;opacity:.8;text-align:right;}
  .lvl-body{padding:16px 18px 6px;}

  .q{background:#fff;border-radius:16px;padding:14px 16px 16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
  .q.done{border:2px solid #cdebd6;} .q.done.wrong{border-color:#f3c9c2;}
  .q-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;}
  .q-n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--violet);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .q.done .q-n{background:var(--green);} .q.done.wrong .q-n{background:#c78a82;}
  .q-p{font-weight:600;font-size:16px;} .q-p small{display:block;font-weight:400;color:var(--ink-soft);font-size:14.5px;margin-top:2px;}
  .indent{margin-left:40px;}
  .q textarea,.fld textarea,.fld input[type=text]{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;font:inherit;font-size:16px;background:#fff;resize:vertical;}
  .keys{margin:0 0 8px 40px;font-size:14.5px;background:#F8F7FD;border-radius:12px;padding:8px 12px;color:var(--ink-soft);}
  .keys b{color:var(--violet-deep);}
  .q-actions{margin:10px 0 0 40px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .q-actions .btn{padding:10px 20px;font-size:15px;border-radius:12px;}
  .fb{margin:12px 0 0 40px;border-radius:12px;padding:10px 14px;font-size:15.5px;line-height:1.5;}
  .fb.ok{background:var(--green-bg);color:#17603a;} .fb.ko{background:var(--red-bg);color:#8a2a1f;} .fb.info{background:var(--blue-light);color:#1F4F9E;} .fb.warn{background:var(--amber-bg);color:#6B4B00;}
  .corr{margin:10px 0 0 40px;background:#F8F7FD;border-radius:12px;padding:8px 12px;font-size:15.5px;white-space:pre-wrap;}
  .corr small{display:block;color:var(--ink-soft);font-weight:600;font-size:13px;}
  .fld{margin:0 0 10px;} .fld label{display:block;font-size:14px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
  .fld.chk label{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;color:var(--ink);font-weight:500;}
  .fld.chk input{width:20px;height:20px;margin-top:3px;}

  /* carte mentale */
  .map{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0;}
  .map .center{grid-column:1/-1;justify-self:center;border:3px solid var(--violet);border-radius:50%/60%;padding:14px 32px;background:var(--violet-light);font-weight:700;text-align:center;}
  .map .br{border-radius:16px;padding:10px 12px;border:2px solid var(--line);background:#fff;}
  .map .br.c0{background:#FDEAF1;border-color:#f5cfdd;} .map .br.c1{background:#FFF1E4;border-color:#f6d9bd;}
  .map .br.c2{background:#FFF7CF;border-color:#f0e4a4;} .map .br.c3{background:#E6F6EA;border-color:#cdebd6;}
  .map .br.c4{background:#E5EFFF;border-color:#cfe0fb;} .map .br.c5{background:#EFEAFC;border-color:#d4c8fa;}
  .map .br.miss{border-color:var(--red);}
  .map label{display:block;font-weight:700;font-size:15px;margin-bottom:4px;}
  .map textarea{width:100%;border:2px solid rgba(0,0,0,.08);border-radius:10px;padding:8px 10px;font:inherit;font-size:16px;resize:vertical;background:#fff;}
  .map .ro{background:#fff;border-radius:10px;padding:8px 10px;min-height:44px;white-space:pre-wrap;}
  .src-row{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0;}
  .preview{max-height:300px;border-radius:14px;margin:10px 0;border:2px solid var(--line);}
  .chg{background:#fff;border-radius:12px;border:1px solid var(--line);padding:8px 12px;margin-bottom:8px;font-size:15px;}
  .chg .arrow{color:var(--ink-soft);} .chg s{color:#b04a3f;} .chg b{color:var(--green);}
  .chg small{display:block;color:var(--ink-soft);}

  /* prononciation */
  .words{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;}
  .wcard{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;min-width:150px;}
  .wcard b{font-size:17px;} .wcard .ipa{color:var(--ink-soft);font-size:14.5px;} .wcard .say{font-weight:600;color:var(--violet-deep);} .wcard .tip{font-size:14px;color:var(--ink-soft);}
  .sent{font-size:18px;line-height:2;margin:4px 0 8px;}
  .tok{padding:1px 3px;border-radius:6px;cursor:pointer;}
  .tok:hover{background:var(--violet-light);}
  .tok.good{background:var(--green-bg);color:#17603a;} .tok.bad{background:#FFE7C2;color:#7a4300;}
  .row-btns{display:flex;gap:8px;flex-wrap:wrap;}
  .meter{height:8px;border-radius:6px;background:#EEEAF8;overflow:hidden;margin-top:6px;} .meter i{display:block;height:100%;background:var(--green);}

  /* enregistrement */
  .recbox{background:#F8F7FD;border-radius:14px;padding:12px 14px;margin:10px 0;}
  .recbox audio{width:100%;margin-top:8px;}
  .timer{font-weight:700;font-variant-numeric:tabular-nums;margin-left:6px;}
  .readtext{background:#fff;border:2px dashed var(--line);border-radius:14px;padding:12px 16px;font-size:18px;line-height:1.9;white-space:pre-wrap;margin:8px 0;}

  .finish{background:#fff;border-radius:22px;padding:26px;text-align:center;box-shadow:0 8px 30px rgba(61,43,102,.12);margin-top:18px;}
  .finish h2{margin:0 0 6px;color:var(--violet-deep);}

  @media (max-width:640px){
    .hero .band{padding:18px;} .hero .in{padding:12px 18px 18px;}
    .indent,.keys,.q-actions,.fb,.corr{margin-left:0;}
    .map{grid-template-columns:1fr;} .lvl-head .tag{display:none;}
  }
  textarea{display:block;width:100%;box-sizing:border-box;padding:10px 12px;border:2px solid var(--line);border-radius:12px;font:inherit;font-size:16px;line-height:1.5;background:#fff;resize:vertical;}
  .hl{background:linear-gradient(transparent 55%,#FFE97F 55%);font-weight:700;padding:0 2px;}
</style>
</head>
<body>

<div class="topbar hidden" id="topbar">
  <div class="brand">🎤 Préparer mon oral</div>
  <div class="who" id="who"></div>
  <button id="home-btn" type="button">Accueil</button>
</div>
<div class="sync-warn hidden" id="sync-warn">⚠ Connexion instable : certaines réponses n'ont pas encore été enregistrées. Garde cette page ouverte, on réessaie automatiquement.</div>
<div class="wrap" id="app"></div>

<script>
const SUPABASE_URL = "https://eyfqryrwivjwwaftehdc.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZnFyeXJ3aXZqd3dhZnRlaGRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNDU2NjIsImV4cCI6MjEwMjkyMTY2Mn0.i9YiNL45rILlxyckLMl3SJVIIib8P40DSIaiNkm89tc";
const GRADE_ENDPOINT = SUPABASE_URL + "/functions/v1/grade-advanced";
const LEVELUP_URL = 'https://levelup-5bt.pages.dev';
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const C = window.ORAL_COURSE, PARTS = window.ORAL_PARTS, BOXES = window.ORAL_MAP_BOXES, VOCAB = window.ORAL_VOCAB, BRIEF = window.ORAL_CLIENT_BRIEF;
const FALLBACK_CLASSES = ['2nde TNE','2nde MES','2nde BMA','1ère MES','1ère MELEC'];
const DEFAULT_KEYS = {
  1:['Hello','my name is …','I am going to present','my sign','Green Leaf Bakery'],
  2:['the client is Sarah Green','she wants','modern','eco-friendly','easy to read','green and white','wood / natural','avoid shiny plastic'],
  6:['In conclusion','my sign is …','modern','eco-friendly','Thank you for listening']
};

/* ============ utilitaires ============ */
// Ignore les valeurs vides (null/false) passées à append/replaceChildren au lieu d'écrire « null » à l'écran
['append','prepend','replaceChildren'].forEach(m => { const o = Element.prototype[m]; Element.prototype[m] = function(...a){ return o.apply(this, a.filter(x => x != null && x !== false)); }; });
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if(props) for(const [k,v] of Object.entries(props)){
    if(v == null || v === false) continue;
    if(k === 'class') el.className = v;
    else if(k === 'html') el.innerHTML = v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for(const kid of kids.flat()){ if(kid == null || kid === false) continue; el.append(kid.nodeType ? kid : document.createTextNode(kid)); }
  return el;
}
function norm(s){
  return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’‘`´]/g,"'").replace(/[.!?,;:]+$/,'').replace(/\s+/g,' ').trim();
}
function speak(text, rate){
  if(!('speechSynthesis' in window)){ alert("Ton navigateur ne peut pas lire à voix haute."); return; }
  const u = new SpeechSynthesisUtterance(text); u.lang = 'en-GB'; u.rate = rate || 0.9;
  const v = speechSynthesis.getVoices().find(v => /^en[-_]GB/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^en/i.test(v.lang));
  if(v) u.voice = v;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
const clip = (s, n) => String(s == null ? '' : s).slice(0, n);

/* ============ identité, état, enregistrement ============ */
let ID = null;
const STATE = {};
const PENDING = [];
let curLevel = 'A';

function loadId(){ try{ return JSON.parse(localStorage.getItem('oral-id')||'null'); }catch(e){ return null; } }
function saveId(){ try{ localStorage.setItem('oral-id', JSON.stringify(ID)); }catch(e){} }

async function saveAnswer(q, answer, correct, revealed, feedback, extra){
  const payload = { p_course:C.id, p_classe:ID.classe, p_student:ID.name, p_norm:ID.norm, p_step:q.step, p_level:q.level || '—',
    p_qid:q.id, p_prompt:clip(q.prompt, 300), p_answer:clip(answer, 6000), p_correct:correct, p_revealed:!!revealed, p_feedback:clip(feedback, 1500), p_extra:extra || null };
  try{ const { error } = await supa.rpc('save_course_answer_v2', payload); if(error) throw error; }
  catch(e){ PENDING.push(payload); document.getElementById('sync-warn').classList.remove('hidden'); }
}
setInterval(async () => {
  if(!PENDING.length) return;
  const batch = PENDING.splice(0);
  for(const p of batch){ try{ const { error } = await supa.rpc('save_course_answer_v2', p); if(error) throw error; } catch(e){ PENDING.push(p); } }
  if(!PENDING.length) document.getElementById('sync-warn').classList.add('hidden');
}, 8000);

async function loadProgress(){
  Object.keys(STATE).forEach(k => delete STATE[k]);
  const { data } = await supa.rpc('get_course_progress_v2', { p_course:C.id, p_classe:ID.classe, p_norm:ID.norm });
  (data || []).forEach(r => {
    const done = r.is_correct === true || r.revealed === true || (r.is_correct === null && !!r.answer) || (/^3-s/.test(r.qid) && r.attempts >= 3);
    STATE[r.qid] = { tries:r.attempts || 1, done, correct:r.is_correct, revealed:r.revealed, answer:r.answer, feedback:r.feedback, extra:r.extra || null, restored:true };
  });
}
const S = id => STATE[id] || (STATE[id] = {tries:0});
const qDone = id => !!(STATE[id] && STATE[id].done);

/* ============ progression ============ */
const levelDone = L => PARTS.every(p => qDone('2' + L + '-' + p.k));
const levelCount = L => PARTS.filter(p => qDone('2' + L + '-' + p.k)).length;
function stepDone(n){
  if(n === 1) return qDone('1-map');
  if(n === 2) return ['A','B','C'].some(levelDone);
  if(n === 3) return qDone('3-end');
  if(n === 4) return qDone('4-t1') && qDone('4-t2');
  return false;
}
function isTeacher(){ if(new URLSearchParams(location.search).get('test') === '1') return true; if(!ID) return false; const t = String(ID.norm || ID.name || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').split(/[^a-z]+/).filter(Boolean); return t.includes('clemence') && (t.includes('peret') || t.includes('perret')); }
const stepUnlocked = n => isTeacher() || n === 1 || stepDone(n - 1);
function stepStarted(n){
  if(n === 1) return !!(STATE['1-map']);
  if(n === 2) return ['A','B','C'].some(L => levelCount(L) > 0);
  if(n === 3) return Object.keys(STATE).some(k => /^3-/.test(k));
  return Object.keys(STATE).some(k => /^4-/.test(k));
}
function currentMap(){ const s = STATE['1-map']; return s && s.extra && s.extra.map ? s.extra.map : null; }

async function callAI(system, content, ms){

  try{
    const res = await fetch(GRADE_ENDPOINT, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ systemPrompt:system, userContent:content }), signal:ctrl.signal });
    if(!res.ok) throw new Error('http');

    return d;
  }catch(e){ return null; } finally{ clearTimeout(timer); }
}

const MAP_SYSTEM = `Tu aides un.e élève de 2nde bac pro (niveau A2 en anglais) à préparer un oral en anglais. Projet : "From client brief to shop sign" — l'élève a conçu un panneau (enseigne) pour une boulangerie. ${BRIEF}

RÈGLES :
- Chaque zone = quelques mots-clés ou très courtes expressions en anglais simple, séparés par des virgules (ex : "sage green, cream" / "natural, eco-friendly, fresh"). Pour les zones "why" : des adjectifs ou groupes très courts (pas de longues phrases).

function gradeSystem(){
  return `Tu es un professeur d'anglais bienveillant pour des élèves de 2nde bac pro, niveau A2. L'élève prépare un oral (présenter un panneau pour la boulangerie "Green Leaf Bakery") et t'écrit UNE PARTIE de son discours. ${BRIEF}

- "corrected" : le texte de l'élève avec SEULEMENT les corrections nécessaires (orthographe, grammaire, vocabulaire, ordre des mots), à la 1re personne comme l'élève, en anglais simple A2. Garde ses idées et ses mots autant que possible, n'ajoute aucune idée nouvelle, ne rallonge pas. Si ok = false et TENTATIVE = 1, mets "".

async function gradePart(part, text, tries){

function fileToJpegB64(file, maxSide){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const k = Math.min(1, (maxSide || 1568) / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const data = cv.toDataURL('image/jpeg', 0.82); URL.revokeObjectURL(url);
      resolve({ b64:data.split(',')[1], preview:data });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src = url;
  });
}

  btn.addEventListener('click', async () => {

    if(text.includes('___')){ setFb('warn', 'Remplace les ___ par tes idées avant de vérifier 🙂'); return; }
    if(L === 'A' && norm(text) === norm(p.frame)){ setFb('warn', 'Complète la phrase avec tes idées 🙂'); return; }
    btn.disabled = true; ta.disabled = true; setFb('info', 'Correction en cours…');

    st.answer = text; st.feedback = feedback; st.correct = ok; st.revealed = revealed; st.extra = {corrected}; st.done = ok !== false || revealed;
    saveAnswer({id, step:2, level:L, prompt:'Partie ' + p.k + ' — ' + p.title + ' (niveau ' + L + ')'}, text, ok, revealed, feedback, {corrected});

    if(ok === false && !revealed) setFb('ko', feedback); else if(ok === false) setFb('ko', feedback); else setFb('ok', feedback);
    if(st.done && corrected && norm(corrected) !== norm(text)) box.insertBefore(h('div', {class:'corr', style:'background:var(--green-bg)'}, h('small', null, ok === false ? 'Version à retenir' : 'Version corrigée'), corrected), fb.nextSibling);

}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function composedScript(){
  const L = ['C','B','A'].find(levelDone); if(!L) return '';
  return PARTS.map(p => { const s = STATE['2' + L + '-' + p.k]; return (s.extra && s.extra.corrected) || s.answer; }).join('\n');
}
function splitSentences(t){
  const raw = (t.replace(/\s*\n\s*/g, ' ').match(/[^.!?]+[.!?]+|[^.!?]+$/g) || []).map(s => s.trim()).filter(Boolean);
  const out = [];
  raw.forEach(s => { if(out.length && s.split(/\s+/).length < 3) out[out.length - 1] += ' ' + s; else out.push(s); });
  return out;
}
function tokens(s){ return norm(s).replace(/[^a-z0-9' ]/g, ' ').split(/\s+/).filter(Boolean); }
function compare(expected, heard){
  const pool = tokens(heard).slice(); const exp = expected.split(/\s+/);
  const marks = exp.map(w => { const t = tokens(w)[0]; if(!t) return true; const i = pool.indexOf(t); if(i >= 0){ pool.splice(i, 1); return true; } return false; });
  const total = marks.filter((_, i) => tokens(exp[i]).length).length || 1;
  const ok = marks.filter((m, i) => m && tokens(exp[i]).length).length;
  return { marks, exp, pct:Math.round(100 * ok / total) };
}
async function ensureMic(){
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return;
  let st;
  try{ st = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ throw (e && (e.name === 'NotFoundError' || e.name === 'DevicesNotFoundError')) ? 'no-mic' : 'not-allowed'; }
  st.getTracks().forEach(t => t.stop());
  await new Promise(r => setTimeout(r, 250));
}
function listenOnce(){
  return new Promise((resolve, reject) => {
    const r = new SR(); r.lang = 'en-GB'; r.interimResults = false; r.maxAlternatives = 3; let got = null;
    r.onresult = e => { got = Array.from(e.results[0]).map(a => a.transcript); };
    r.onerror = e => reject(e.error || 'error');
    r.onend = () => got ? resolve(got) : reject('no-speech');
    try{ r.start(); }catch(e){ reject('start'); }
  });
}

const REC = {};
function recorder(takeId){
  const supported = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  const wrap = h('div', {class:'recbox'});
  if(!supported){
    wrap.append(h('div', {class:'fb warn', style:'margin:0'}, "Ton navigateur ne peut pas enregistrer ici. Utilise l'appli Dictaphone de ton téléphone, puis coche la case ci-dessous."));
    const c = h('input', {type:'checkbox'}); c.addEventListener('change', () => { REC[takeId] = c.checked; });
    wrap.append(h('div', {class:'fld chk', style:'margin-top:8px'}, h('label', null, c, h('span', null, "J'ai fait cette prise avec un autre appareil."))));
    return wrap;
  }
  let mr = null, chunks = [], stream = null, t0 = 0, tick = null;
  const status = h('span', null, 'Prêt.e ? Clique sur le bouton rouge.'); const timer = h('span', {class:'timer'}, '0:00');
  const btn = h('button', {class:'btn rec small', type:'button'}, '⏺️ Enregistrer');
  const audio = h('audio', {controls:true, class:'hidden'}); const dl = h('a', {class:'hidden', style:'display:inline-block;margin-top:6px;font-size:14.5px;color:var(--violet);font-weight:600'}, '⬇ Télécharger mon enregistrement');
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  btn.addEventListener('click', async () => {
    if(mr && mr.state === 'recording'){ mr.stop(); return; }
    try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(e){ status.textContent = "Le micro est bloqué : autorise-le dans ton navigateur puis réessaie."; return; }
    const mt = ['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
    chunks = []; mr = new MediaRecorder(stream, mt ? {mimeType:mt} : undefined);
    mr.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = () => {
      clearInterval(tick); stream.getTracks().forEach(t => t.stop());
      const type = mr.mimeType || mt || 'audio/webm'; const blob = new Blob(chunks, {type}); const url = URL.createObjectURL(blob);
      audio.src = url; audio.classList.remove('hidden'); dl.href = url; dl.download = 'mon-oral-' + takeId + (/mp4/.test(type) ? '.m4a' : '.webm'); dl.classList.remove('hidden');
      btn.textContent = '🔁 Refaire une prise'; status.textContent = 'Réécoute-toi, puis remplis ta grille ci-dessous.'; REC[takeId] = true;
    };
    mr.start(); t0 = Date.now(); btn.textContent = '⏹️ Arrêter'; status.textContent = 'Enregistrement en cours…';
    tick = setInterval(() => { timer.textContent = fmt((Date.now() - t0) / 1000); }, 500);
  });
  wrap.append(h('div', {style:'display:flex;align-items:center;gap:10px;flex-wrap:wrap'}, btn, status, timer), audio, dl, h('div', {style:'font-size:13.5px;color:var(--ink-soft);margin-top:6px'}, '🔒 Ton enregistrement reste sur ton appareil : il n\'est envoyé à personne.'));
  return wrap;
}

function takeCard(t, n){
  const st = S(t.id);
  const box = h('div', {class:'box'}, h('h3', null, '🎙️ ' + t.title));
  if(st.done && (st.restored || st.frozen)){
    box.append(h('div', {class:'corr', style:'margin-left:0'}, h('small', null, 'Mon auto-évaluation'), st.answer || ''), h('div', {class:'fb ok', style:'margin:8px 0 0'}, '✔ Prise enregistrée. Tu peux en refaire une autre quand tu veux pour t\'entraîner !'));
    return box;
  }
  const crit = [['clear','Je parle assez fort et distinctement.'],['pace','Je ne vais pas trop vite et je fais des pauses aux points.'],['stress','J\'insiste sur les mots importants (couleurs, matériaux, police).'],['hard','Je prononce bien mes mots difficiles.'],['last', t.last]];
  const checks = {};
  const grid = h('div', null, h('div', {style:'font-weight:600;margin:6px 0'}, 'Ma grille d\'auto-évaluation (après m\'être réécouté.e) :'));
  crit.forEach(([k, l]) => { checks[k] = h('input', {type:'checkbox'}); grid.append(h('div', {class:'fld chk', style:'margin:0 0 4px'}, h('label', null, checks[k], h('span', null, l)))); });
  const improve = h('textarea', {rows:2, spellcheck:'false', placeholder:'Écris ici…'});
  const fb = h('div', {class:'fb warn hidden', style:'margin:10px 0 0'}); const btn = h('button', {class:'btn', type:'button', style:'margin-top:10px'}, '✔ Valider cette prise');

    if(!REC[t.id]){ fb.className = 'fb warn'; fb.textContent = "Enregistre-toi d'abord (bouton rouge), puis réécoute-toi 🙂"; return; }
    if(!improve.value.trim()){ fb.className = 'fb warn'; fb.textContent = "Écris un point à améliorer pour la prochaine prise 🙂"; return; }
    const ok = crit.filter(([k]) => checks[k].checked).map(([, l]) => '✔ ' + l);
    const ans = 'Critères réussis (' + ok.length + '/' + crit.length + ') :\n' + (ok.join('\n') || '—') + '\nÀ améliorer : ' + improve.value.trim();
    st.tries++; st.done = true; st.correct = null; st.answer = ans; st.frozen = true;
    await saveAnswer({id:t.id, step:4, level:'—', prompt:t.title}, ans, null, false, ok.length + '/' + crit.length + ' critères', {score:ok.length});
    renderStep(4);
  });
  box.append(h('div', null, n === 1 ? 'Lis ton texte à voix haute en entier, comme le jour de l\'oral.' : 'Cette fois, cache ton texte : explique ton panneau en t\'aidant seulement de ta carte mentale.'), t.show(), recorder(t.id), grid, h('div', {class:'fld', style:'margin-top:8px'}, h('label', null, 'Un point à améliorer pour la prochaine prise'), improve), btn, fb);
  return box;
}

    app.replaceChildren(h('div', {class:'id-card'}, h('div', {class:'body'},
      h('h1', null, 'Re-bonjour ' + saved.first + ' !'), h('p', {class:'sub'}, saved.classe + " — on reprend là où tu t'étais arrêté.e ?"),
      h('button', {class:'btn block', type:'button', onclick:() => { let n = 0; try{ n = +localStorage.getItem('oral-step') || 0; }catch(e){} if(n >= 1 && n <= C.steps.length && stepUnlocked(n)) renderStep(n); else renderHome(); }}, 'Reprendre'),
      h('button', {class:'btn ghost block', type:'button', style:'margin-top:10px', onclick:() => renderIdentify()}, "Ce n'est pas moi"))));
  } else renderIdentify();
})();
</script>
</body>
</html>
