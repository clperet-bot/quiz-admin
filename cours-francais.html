<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dis-le bien</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="francais-data.js"></script>
<style>
/* ===== Thème « Messagerie » : des bulles de SMS (familier) qui deviennent une lettre sur papier (soutenu) ===== */
:root{ --cream:#FBF3E4; --paper:#FFFDF8; --sand:#F1E4CA; --line:#E2D2B1; --navy:#1B2A4E; --navy2:#2C4072; --muted:#56627F;
  --coral:#E8553F; --coral-d:#C9402B; --coral-l:#FFD9CF; --yellow:#FFE45C; --green:#2E8B63; --green-l:#D6F0E2; --red:#B8322A; --red-l:#FDE0DC; --blue-l:#DDE6FA; }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Nunito',system-ui,sans-serif;font-size:17px;line-height:1.55;color:var(--navy);background:var(--cream);-webkit-text-size-adjust:100%;
  background-image:radial-gradient(rgba(27,42,78,.06) 1.2px,transparent 1.3px);background-size:26px 26px;}
button{font-family:inherit;} .hidden{display:none !important;}
h1,h2,h3,h4{font-family:'Fredoka','Nunito',sans-serif;font-weight:600;margin:0;line-height:1.15;}
b{font-weight:800;}
.serif{font-family:'Lora',Georgia,serif;}

.topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;box-shadow:0 3px 0 var(--coral);}
.topbar .brand{font-family:'Fredoka',sans-serif;font-weight:600;font-size:21px;white-space:nowrap;} .topbar .brand span{color:var(--coral-l);}
.topbar .who{flex:1;min-width:0;text-align:right;font-size:14px;color:#C9D3EE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar button{background:transparent;color:#fff;border:2px solid #fff;border-radius:999px;padding:6px 14px;font-size:15px;font-weight:700;cursor:pointer;min-height:40px;}
.sync-warn{background:var(--yellow);color:var(--navy);font-size:16px;text-align:center;padding:8px 12px;font-weight:700;}
.test-banner{background:var(--yellow);color:var(--navy);font-weight:800;text-align:center;padding:8px 12px;font-size:16px;border-radius:14px;margin-bottom:12px;}
.wrap{max-width:880px;margin:0 auto;padding:24px 16px 80px;}

.btn{background:var(--navy);color:#fff;border:0;border-radius:999px;padding:13px 24px;min-height:50px;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 4px 0 var(--coral);transition:transform .08s,box-shadow .08s;}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--coral);}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none;}
.btn.block{width:100%;}
.btn.ghost{background:transparent;color:var(--navy);border:2px solid var(--navy);box-shadow:none;}
.btn.coral{background:var(--coral-d);box-shadow:0 4px 0 var(--navy);}
.err{background:var(--red-l);color:var(--red);border:2px solid var(--red);border-radius:14px;padding:10px 14px;font-size:16px;margin-top:12px;font-weight:700;}
.hl,.fr .hl{background:var(--yellow);color:var(--navy);font-weight:800;padding:0 5px;border-radius:5px;}

/* couverture : bulles -> lettre */
.cover{background:var(--navy);color:#fff;border-radius:26px;padding:22px 22px 20px;position:relative;overflow:hidden;}
.cover:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:var(--navy2);}
.cv-grid{position:relative;z-index:1;display:grid;gap:18px;grid-template-columns:1fr;align-items:center;}
@media (min-width:700px){ .cv-grid{grid-template-columns:1.1fr 1fr;} }
.kicker{display:inline-block;background:var(--coral);color:#fff;font-weight:800;font-size:14px;letter-spacing:.06em;padding:3px 12px;border-radius:999px;}
.big{font-size:clamp(46px,13vw,76px);margin:10px 0 6px;letter-spacing:-.01em;} .big em{font-style:normal;color:var(--coral-l);}
.cv-sub{margin:0;color:#D5DDF3;font-size:17px;}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0;}
.chip{display:inline-block;border:2px solid var(--navy);color:var(--navy);font-size:14px;font-weight:800;padding:1px 10px;border-radius:999px;white-space:nowrap;background:transparent;}
.cover .chip{border-color:#6E83B8;color:#fff;} .chip.l{background:var(--coral);border-color:var(--coral);color:#fff;} .chip.ok{background:var(--green);border-color:var(--green);color:#fff;} .chip.dim{border-color:var(--line);color:var(--muted);}
.chat{display:flex;flex-direction:column;gap:9px;}
.cvb{max-width:92%;padding:10px 14px;font-size:16px;line-height:1.35;border-radius:20px;}
.cvb.fam{align-self:flex-start;background:var(--coral-l);color:var(--navy);border-bottom-left-radius:5px;font-weight:600;}
.cvb.cou{align-self:flex-end;background:#fff;color:var(--navy);border-bottom-right-radius:5px;font-weight:600;}
.cvl{align-self:stretch;background:var(--paper);color:var(--navy);border-radius:6px;padding:12px 14px 12px 14px;font-family:'Lora',serif;font-size:16px;position:relative;border-left:6px solid var(--coral);transform:rotate(-1deg);box-shadow:0 6px 0 rgba(0,0,0,.18);}
.cvl .stamp{position:absolute;right:8px;top:-12px;background:var(--coral);color:#fff;width:34px;height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:18px;transform:rotate(6deg);}
.cvl small{display:block;font-family:'Nunito',sans-serif;font-size:14px;color:var(--muted);margin-bottom:2px;}
.poster{background:var(--paper);border:3px solid var(--navy);border-radius:26px;box-shadow:0 8px 0 var(--coral);overflow:hidden;}
.poster .body{padding:20px 22px 24px;}
.poster h2{font-size:32px;margin:0 0 2px;} .sub{margin:0 0 16px;color:var(--muted);font-size:17px;}
.mission{font-size:19px;margin:0 0 6px;}
.field{margin-bottom:14px;} .field label{display:block;font-size:16px;font-weight:800;margin-bottom:5px;}
.field input,.field select,textarea{width:100%;padding:12px 14px;min-height:50px;border:2px solid var(--navy);border-radius:14px;font:inherit;font-size:17px;background:#fff;color:var(--navy);}
textarea{line-height:1.55;resize:vertical;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--coral);box-shadow:0 0 0 4px rgba(232,85,63,.25);}

/* écran « Quelles sont tes difficultés ? » : une conversation */
.askhead{display:flex;gap:10px;align-items:center;margin-bottom:6px;}
.askhead .badge{background:var(--coral-d);color:#fff;font-family:'Fredoka',sans-serif;font-size:16px;padding:3px 14px;border-radius:999px;}
.ask{font-size:clamp(32px,8vw,48px);margin:6px 0 10px;} .ask em{font-style:normal;color:var(--coral-d);}
.botrow{display:flex;gap:10px;align-items:flex-end;margin:0 0 18px;}
.avatar{flex:none;width:46px;height:46px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;font-size:23px;}
.bot{background:#fff;border:2px solid var(--navy);border-radius:20px 20px 20px 5px;padding:10px 16px;font-size:17px;max-width:560px;}
.grp{font-size:22px;margin:22px 0 10px;display:flex;align-items:center;gap:10px;} .grp:after{content:"";flex:1;border-top:3px dashed var(--coral);} .grp:first-of-type{margin-top:6px;}
.tiles{display:grid;grid-template-columns:1fr;gap:12px;}
@media (min-width:640px){ .tiles{grid-template-columns:1fr 1fr;} }
.tile{position:relative;display:flex;gap:12px;align-items:center;text-align:left;width:100%;min-height:84px;background:#fff;color:var(--navy);border:3px solid var(--navy);border-radius:24px 24px 6px 24px;padding:12px 16px 12px 12px;cursor:pointer;transition:transform .08s;font-size:17px;}
.tile:hover{transform:translateY(-2px);}
.tile .ic{flex:none;width:52px;height:52px;border-radius:50%;background:var(--sand);display:flex;align-items:center;justify-content:center;font-size:27px;}
.tile .tx{min-width:0;} .tile .ti{display:block;font-weight:800;font-size:17px;line-height:1.25;} .tile .tg{display:block;color:var(--muted);font-size:15px;margin-top:2px;}
.tile .ck{position:absolute;right:10px;top:-13px;width:30px;height:30px;background:var(--yellow);color:var(--navy);font-weight:800;font-size:17px;display:none;align-items:center;justify-content:center;border-radius:50%;border:3px solid var(--navy);}
.tile.sel{background:var(--navy);color:#fff;box-shadow:0 5px 0 var(--coral);} .tile.sel .tg{color:#C9D3EE;} .tile.sel .ic{background:var(--navy2);} .tile.sel .ck{display:flex;}
.tile.lock{cursor:default;} .tile .st{display:inline-block;margin-top:4px;font-size:14px;font-weight:800;background:var(--yellow);color:var(--navy);padding:0 10px;border-radius:999px;}
.pickbar{position:sticky;bottom:0;z-index:15;margin:22px -16px -80px;padding:12px 16px 16px;background:var(--cream);border-top:3px solid var(--navy);box-shadow:0 -8px 14px rgba(251,243,228,.95);display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;}
.lit-fld{margin:12px 0 10px;padding:10px 12px 12px;background:var(--yellow);border-radius:16px;} .lit-fld>label{display:block;font-weight:800;font-size:16.5px;margin:0 0 4px;} .lit-fld p{margin:0 0 8px;font-size:16.5px;} .lit-fld textarea{background:#fff;} .lit-fld .hl{background:#fff;}
.pickbar .cnt{font-weight:800;font-size:16px;} .pickbar .cnt b{color:var(--coral-d);font-size:24px;font-family:'Fredoka',sans-serif;}
.pickbar .soft{flex-basis:100%;color:var(--muted);font-size:15px;}

/* programme */
.sech{display:flex;align-items:center;gap:10px;margin:26px 0 12px;} .sech h3{font-size:28px;} .sech:after{content:"";flex:1;height:0;border-top:3px dashed var(--coral);}
.roadmap{display:flex;flex-direction:column;gap:12px;}
.rm-row{display:flex;align-items:stretch;background:#fff;border:3px solid var(--navy);border-radius:22px;cursor:pointer;transition:transform .08s;overflow:hidden;}
.rm-row:not(.locked):hover{transform:translateY(-2px);}
.rm-row.locked{opacity:.55;cursor:not-allowed;} .rm-row.done{border-color:var(--green);background:#F3FBF6;}
.badge-n{flex:none;width:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--navy);color:#fff;font-family:'Fredoka',sans-serif;font-size:34px;line-height:1;}
.badge-n:before{content:"ÉTAPE";font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;letter-spacing:.08em;margin-bottom:2px;color:var(--coral-l);}
.badge-n.done{background:var(--green);} .badge-n.done:before{content:"FAIT";color:#fff;}
.rm-ribbon{flex:1;min-width:0;padding:12px 14px;display:flex;flex-direction:column;gap:8px;}
.rm-ribbon .ti{font-weight:800;font-size:18px;line-height:1.3;} .rm-ribbon .ti small{display:block;font-weight:600;font-size:15px;color:var(--muted);}
.plan{display:flex;gap:6px;flex-wrap:wrap;}
.mailprog{background:var(--paper);border:3px solid var(--navy);border-radius:8px;padding:14px 16px 16px;margin-top:18px;position:relative;border-left:10px solid var(--coral);}
.mailprog h4{font-size:21px;margin-bottom:8px;} .mailprog p{margin:0 0 10px;font-size:16px;color:var(--muted);}
.stamps{display:flex;gap:8px;flex-wrap:wrap;} .stampc{border:2px dashed var(--line);border-radius:10px;padding:6px 12px;font-size:16px;font-weight:700;color:var(--muted);background:#fff;}
.stampc.ok{border:2px solid var(--green);color:var(--green);background:var(--green-l);} .stampc.todo{border-color:var(--coral);color:var(--navy);}

/* page d'une étape */
.step-head{display:flex;align-items:stretch;background:var(--navy);color:#fff;border-radius:24px;margin-bottom:14px;overflow:hidden;box-shadow:0 6px 0 var(--coral);}
.step-head .badge-n{background:var(--coral-d);width:74px;min-height:80px;} .step-head .badge-n:before{color:#fff;}
.step-head .ribbon{flex:1;min-width:0;padding:12px 16px;display:flex;flex-direction:column;justify-content:center;gap:3px;}
.step-head .ribbon h1{font-size:clamp(26px,6vw,38px);}
.step-head .tg{font-size:16px;font-weight:600;color:#C9D3EE;}
.stopw{display:inline-flex;align-items:center;gap:6px;background:var(--navy2);color:#fff;font-family:'Fredoka',sans-serif;font-size:16px;padding:2px 12px;border-radius:999px;margin-top:4px;align-self:flex-start;}
.missionb{display:flex;gap:10px;align-items:flex-end;margin:0 0 16px;} .missionb .bot{border-color:var(--coral);background:#fff;}

.lesson{background:var(--paper);border:3px solid var(--navy);border-radius:10px;margin-bottom:16px;overflow:hidden;position:relative;}
.lesson>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--navy);color:#fff;padding:10px 14px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:20px;min-height:52px;}
.lesson>summary::-webkit-details-marker{display:none;}
.lesson>summary:before{content:"✉";display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--coral);align-items:center;justify-content:center;font-size:16px;flex:none;}
.lesson>summary .chip{margin-left:auto;border-color:#6E83B8;color:#fff;font-family:'Nunito',sans-serif;}
.lesson[open]>summary:after{content:"▾";margin-left:6px;} .lesson:not([open])>summary:after{content:"▸";margin-left:6px;}
.lb{padding:16px 16px 18px;background-image:repeating-linear-gradient(transparent 0 33px,rgba(27,42,78,.07) 33px 34px);}
.rule{margin:0 0 12px;font-size:17px;} .rule:last-of-type{margin-bottom:0;}
.tblwrap{overflow-x:auto;margin:14px 0 4px;}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:16.5px;background:#fff;border:2px solid var(--navy);border-radius:12px;overflow:hidden;}
.tbl th{background:var(--navy);color:#fff;text-align:left;padding:8px 12px;font-size:15px;font-weight:800;}
.tbl td{border-top:1px solid var(--line);padding:9px 12px;vertical-align:top;} .tbl td:first-child{font-weight:800;color:var(--coral-d);white-space:nowrap;}
.tbl tr.r-fam td:first-child{background:var(--coral-l);color:var(--navy);} .tbl tr.r-cou td:first-child{background:var(--blue-l);color:var(--navy);} .tbl tr.r-sou td:first-child{background:var(--sand);color:var(--navy);font-family:'Lora',serif;}
.tbl tr.r-sou td:last-child{font-family:'Lora',serif;}
.h4s{font-size:18px;margin:16px 0 8px;color:var(--navy);}
.ba{display:grid;gap:12px;margin:6px 0 0;}
.bapair{display:grid;grid-template-columns:1fr;gap:4px;align-items:center;}
@media (min-width:640px){ .bapair{grid-template-columns:1fr 34px 1fr;} }
.arr{text-align:center;font-size:24px;font-weight:800;color:var(--coral-d);transform:rotate(90deg);} @media (min-width:640px){ .arr{transform:none;} }
.bub{border-radius:20px;padding:9px 14px;font-size:17px;line-height:1.4;position:relative;} .bub .lab{display:block;font-size:14px;font-weight:800;opacity:.75;margin-bottom:1px;}
.bub.bef{background:var(--coral-l);border-bottom-left-radius:5px;} .bub.aft{background:var(--navy);color:#fff;border-bottom-right-radius:5px;font-weight:600;} .bub.aft .hl{color:var(--navy);}
.ex{margin:14px 0 0;display:grid;gap:8px;}
.ex .row{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;background:#fff;border-left:6px solid var(--coral);border-radius:10px;padding:8px 12px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
.ex .tx{font-weight:700;font-size:17px;} .ex .note{font-size:15px;color:var(--muted);font-weight:600;}
.letter{margin:14px 0 4px;background:#fff;border:2px solid var(--navy);border-radius:6px;padding:18px 18px 16px;font-family:'Lora',Georgia,serif;font-size:17px;line-height:1.6;white-space:pre-line;position:relative;box-shadow:5px 5px 0 var(--sand);}
.letter:before{content:"✉";position:absolute;right:12px;top:-15px;background:var(--coral);color:#fff;width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:19px;transform:rotate(5deg);}
.check{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:7px;} .check li{display:flex;gap:10px;align-items:flex-start;font-size:17px;} .check li:before{content:"✓";flex:none;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px;margin-top:1px;}
.vtabs{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 12px;} .vtabs .vl{font-weight:800;font-size:16px;color:var(--navy);margin-right:2px;}
.vt{background:#fff;color:var(--navy);border:2.5px solid var(--navy);border-radius:999px;padding:6px 16px;min-height:42px;font:800 16px 'Nunito',sans-serif;cursor:pointer;} .vt.active{background:var(--navy);color:#fff;} .vt.okd:not(.active){border-color:var(--green);color:var(--green);}
.chip.vlab{background:var(--yellow);border-color:var(--navy);color:var(--navy);}
.fig{margin:0 0 12px;text-align:center;} .fig img{max-width:100%;max-height:340px;border:3px solid var(--navy);border-radius:8px;background:#fff;box-shadow:4px 4px 0 var(--sand);} .fig figcaption{font-size:16px;font-weight:700;margin-top:6px;color:var(--navy);}
.fig.slot .ph{border:3px dashed var(--coral);border-radius:12px;padding:18px;font-size:16px;font-weight:700;color:var(--coral-d);background:#fff;}
.fiche{margin:0 0 12px;background:#fff;border:2px solid var(--navy);border-radius:10px;padding:10px 14px;font-size:17px;line-height:1.6;box-shadow:4px 4px 0 var(--sand);} .fiche>b.fh{display:block;font-family:'Fredoka',sans-serif;color:var(--coral-d);}
.mini{margin:16px 0 0;background:var(--yellow);border-radius:16px;padding:12px 14px 14px;} .mini>b{display:block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;margin-bottom:6px;}
.mini .qtxt{margin:0 0 8px;}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 14px;}
.tab{border:3px solid var(--navy);border-radius:20px 20px 6px 20px;background:#fff;color:var(--navy);padding:8px 6px 7px;cursor:pointer;text-align:center;font-family:'Fredoka',sans-serif;font-size:20px;line-height:1.1;min-height:64px;}
.tab small{display:block;font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;color:var(--muted);margin-top:3px;}
.tab.active{background:var(--navy);color:#fff;box-shadow:0 4px 0 var(--coral);} .tab.active small{color:#C9D3EE;}
.tab.okd{border-color:var(--green);} .tab.okd small{color:var(--green);} .tab.okd.active small{color:#BFEBD3;}
.tab:disabled{opacity:.5;cursor:not-allowed;}
.lvl{border:3px solid var(--navy);border-radius:24px;background:#fff;margin-bottom:16px;overflow:hidden;box-shadow:0 6px 0 var(--sand);}
.lvl-head{display:flex;align-items:center;gap:10px;padding:9px 16px;background:var(--blue-l);flex-wrap:wrap;}
.lvl.C .lvl-head{background:var(--coral-l);}
.lvl-head h2{font-size:26px;} .lvl-head .tag{margin-left:auto;font-weight:800;font-size:15px;background:var(--navy);color:#fff;padding:2px 12px;border-radius:999px;}
.lvl-body{padding:16px 14px 6px;}

.q{background:var(--cream);border:2px solid var(--line);border-radius:18px;padding:14px 14px 16px;margin-bottom:14px;}
.q.done{border-color:var(--green);} .q.done.wrong{border-color:var(--red);}
.q-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;}
.q-n{flex:none;min-width:34px;height:34px;border-radius:50%;background:var(--coral-d);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;}
.q.done .q-n{background:var(--green);} .q.done.wrong .q-n{background:var(--red);}
.q-p{font-weight:800;font-size:18px;} .q-p small{display:block;font-weight:500;color:var(--muted);font-size:16.5px;margin-top:3px;}
.sentline{margin:0 0 16px;line-height:2.1;font-size:17.5px;}
.rep{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;font-size:15px;margin-right:8px;}
.qtxt{font-weight:700;font-size:17.5px;margin:0 0 8px;line-height:1.45;}
.blank{display:inline-block;min-width:44px;border-bottom:4px solid var(--coral);margin:0 3px;height:1em;vertical-align:-3px;}
.chg{display:grid;grid-template-columns:1fr 1fr;gap:8px;} .chg.long{grid-template-columns:1fr;} @media (min-width:700px){ .chg.long{grid-template-columns:1fr 1fr;} }

// exercice corrigé automatiquement : 2 essais, puis correction affichée
function detCard(q, title, instruct, build, expected, describe, onDone){
  const st = S(q.id); const box = cardShell(q, title, instruct);
  if(st.done && (st.restored || st.frozen)){
    box.append(h('div', {class:'corr'}, h('small', null, 'Ma réponse'), st.answer || ''), st.feedback ? h('div', {class:'fb ' + (st.correct === false ? 'ko' : 'ok')}, st.feedback) : null);
    if(st.revealed) box.append(h('div', {class:'corr good'}, h('small', null, 'Correction à retenir'), describe(expected)));
    box.classList.add('done'); if(st.correct === false) box.classList.add('wrong'); return box;
  }
  const selects = []; box.append(build(selects));
  const fb = h('div', {class:'fb hidden'}); const btn = h('button', {class:'btn', type:'button', style:'margin-top:10px'}, 'Vérifier');
  const setFb = (k, t) => { fb.className = 'fb ' + k; fb.textContent = t; };
  btn.addEventListener('click', () => {
    const vals = selects.map(s => s.value);
    if(vals.some(v => !v)){ setFb('warn', 'Réponds à toutes les questions 🙂'); return; }
    const res = vals.map((v, i) => eq(v, expected[i]));
    selects.forEach((s, i) => { s.classList.toggle('good', res[i]); s.classList.toggle('bad', !res[i]); });
    st.tries++; const n = res.filter(Boolean).length; const ok = n === res.length; const revealed = !ok && st.tries >= 2;
    const answer = describe(vals);
    let feedback = ok ? 'Bravo, tout est juste !' : revealed ? 'Tu n\'as pas assez bien réussi. La correction est affichée : relis-la bien, puis clique sur « Refaire ce round ».' : n + ' bonne' + (n > 1 ? 's' : '') + ' réponse' + (n > 1 ? 's' : '') + ' sur ' + res.length + '. Corrige les réponses en rouge.';
    if(revealed) selects.forEach((s, i) => { s.value = expected[i]; s.classList.remove('bad'); s.classList.add('good'); });
    st.answer = answer; st.correct = ok; st.revealed = revealed; st.feedback = feedback; st.done = ok || revealed; st.extra = {score:n, total:res.length};
    saveAnswer(q, answer, ok, revealed, feedback, st.extra);
    setFb(ok ? 'ok' : revealed ? 'ko' : 'warn', feedback);
    if(st.done){ st.frozen = true; selects.forEach(s => s.disabled = true); btn.classList.add('hidden'); box.classList.add('done'); if(!ok) box.classList.add('wrong'); box.querySelector('.q-n').textContent = '✓'; updateChrome(); onDone && onDone(); }
  });
  box.append(btn, fb); return box;
}
// exercice corrigé par l'IA, 2 essais puis version à retenir
function aiCard(o){
  const q = o.q, st = S(q.id); const box = cardShell(q, o.title, o.instruct);
  if(st.done && (st.restored || st.frozen)){
    box.append(h('div', {class:'corr'}, h('small', null, 'Ma réponse'), st.answer || ''));
    const c = st.extra && st.extra.corrected;
    if(c && norm(c) !== norm(st.answer)) box.append(h('div', {class:'corr good'}, h('small', null, 'Version corrigée'), c));
    if(st.feedback) box.append(h('div', {class:'fb ' + (st.correct === false ? 'ko' : 'ok')}, st.feedback));
    box.classList.add('done'); if(st.correct === false) box.classList.add('wrong'); return box;
  }
  box.append(o.node);
  const fb = h('div', {class:'fb hidden'}); const btn = h('button', {class:'btn', type:'button', style:'margin-top:10px'}, o.btnLabel || 'Vérifier');
  const setFb = (k, t) => { fb.className = 'fb ' + k; fb.textContent = t; };
  btn.addEventListener('click', async () => {
    const text = o.getText();
    if(!text){ setFb('warn', 'Écris d\'abord ton texte 🙂'); return; }
    if(words(text) < (o.minWords || 8)){ setFb('warn', 'Ton texte est un peu court : ajoute encore une phrase 🙂'); return; }
    const block = o.guard && o.guard(text); if(block){ setFb('warn', block); return; }
    btn.disabled = true; o.setDisabled(true); setFb('info', 'Correction en cours… (10 à 20 secondes)');
    const user = 'CRITÈRES : ' + o.rubric + '\nTENTATIVE : ' + (st.tries + 1) + "\nPRODUCTION DE L'ÉLÈVE :\n" + text;
    const d = await callAI(o.system, user, 60000);
    st.tries++;
    let ok, feedback, corrected = '', revealed = false;
    if(!d || typeof d.ok !== 'boolean'){ ok = null; feedback = '✔ Réponse enregistrée — ta prof la verra.'; }
    else { ok = d.ok; feedback = d.feedback || ''; corrected = (d.corrected || '').trim(); }
    if(ok === false && st.tries >= 2) revealed = true;
    if(ok === true && !corrected) corrected = text;
    st.answer = text; st.feedback = feedback; st.correct = ok; st.revealed = revealed;
    st.extra = {corrected};
    saveAnswer(q, text, ok, revealed, feedback, st.extra);
    if(ok !== false || revealed){
      st.done = true; st.frozen = true; o.setDisabled(true); btn.classList.add('hidden'); box.classList.add('done'); if(ok === false) box.classList.add('wrong'); box.querySelector('.q-n').textContent = '✓';
      setFb(ok === false ? 'ko' : 'ok', feedback); setDraft(q.id, '');
      if(corrected && norm(corrected) !== norm(text)) box.append(h('div', {class:'corr good'}, h('small', null, ok === false ? 'Version à retenir' : 'Version corrigée'), corrected));
      updateChrome(); o.onDone && o.onDone();
    } else { btn.disabled = false; o.setDisabled(false); btn.textContent = 'Réessayer'; setFb('ko', feedback); }
  });
  box.append(btn, fb); return box;
}

/* ============ progression ============ */
// Un round est validé dès qu'UN parcours a été réussi ; refaire un autre parcours ne dévalide jamais le travail déjà validé
const vPass = (k, L, v) => { const st = STATE[qid(k, L, v)]; return !!(st && st.done && st.correct !== false); };
const vFail = (k, L, v) => { const st = STATE[qid(k, L, v)]; return !!(st && st.done && st.correct === false); };
const levelDone = (k, L) => varList(k, L).some(v => vPass(k, L, v));
const levelFailed = (k, L) => !levelDone(k, L) && varList(k, L).some(v => vFail(k, L, v));
// Refaire un parcours : on repart de zéro (la nouvelle tentative remplace l'ancienne dans le suivi)
function resetLevel(k, L, v){ delete STATE[qid(k, L, v || curVar(k, L))]; }
// Parcours suivant pas encore réussi (on revient au début quand tous sont faits)
function nextVariant(k, L){ const n = nVar(k, L), c = curVar(k, L); for(let i = 1; i < n; i++){ const t = ((c - 1 + i) % n) + 1; if(!vPass(k, L, t)) return t; } return (c % n) + 1; }
const stepDone = k => ['A','B','C'].every(L => levelDone(k, L));
function isTeacher(){ if(TEST_MODE) return true; if(!ID) return false; const t = String(ID.norm || ID.name || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').split(/[^a-z]+/).filter(Boolean); return t.includes('clemence') && (t.includes('peret') || t.includes('perret')); }
// Les 3 rounds sont obligatoires, dans l'ordre A → B → C (la prof et ?test=1 peuvent tout ouvrir)
const levelOpen = (k, L) => isTeacher() || L === 'A' || (L === 'B' && levelDone(k, 'A')) || (L === 'C' && levelDone(k, 'B'));
// Parcours : l'étape suivante se débloque quand la précédente est terminée
function stepUnlocked(k){ if(isTeacher()) return true; const P = progKeys(), i = P.indexOf(k); for(let m = 0; m < i; m++){ if(!stepDone(P[m])) return false; } return i >= 0; }

function updateChrome(){

  const P = progKeys(), done = stepDone(k), last = n >= P.length;
  banner.replaceChildren(done ? h('div', {class:'done-banner'}, h('span', {class:'an'}, '✓ Étape faite !'), last ? 'Tu as terminé ton parcours : bravo !' : 'Le morceau de mail est enregistré. L\'étape suivante est débloquée.') :
    h('div', {class:'lvlpick', style:'text-align:center'}, ['A','B','C'].some(L => levelFailed(k, L)) ? h('b', {style:'color:var(--red);display:block'}, '🔁 Un round est à refaire : relis la correction, puis clique sur « Refaire ce round ».') : null, h('b', null, '👆 Pour valider cette étape : Round A, puis B, puis C.'), last ? '' : ' L\'étape suivante se débloque ensuite.'));
  const prev = n > 1 ? h('button', {class:'btn ghost', type:'button', onclick:() => renderStep(P[n - 2])}, '← Étape ' + (n - 1)) : h('span');
  let nxt;
  if(!last){
    const nk = P[n];
    nxt = stepUnlocked(nk) ? h('button', {class:'btn' + (done ? ' coral' : ''), type:'button', onclick:() => renderStep(nk)}, 'Étape ' + (n + 1) + ' →') : h('button', {class:'btn', type:'button', disabled:true, title:'Termine cette étape pour débloquer la suivante'}, '🔒 Étape ' + (n + 1));
  } else nxt = done ? h('button', {class:'btn coral', type:'button', onclick:() => renderHome()}, 'Terminer ✉️') : h('span');
  nav.replaceChildren(prev, nxt);
}
function renderStep(k){ if(!stepUnlocked(k)) return renderHome(); setTop(true); curKey = k; curLevel = ['A','B','C'].find(L => !levelDone(k, L) && levelOpen(k, L)) || 'A'; const body = stepShell(k); viewStep(k, body); updateChrome(); }

/* ---- leçons ---- */
function miniEx(sec){
  const [q, opts, ans, why] = sec.lesson.mini, correct = opts[ans];
  const fb = h('div', {class:'fb hidden'}); let btns = [];
  const pick = (o, b) => { const ok = o === correct; btns.forEach(x => x.classList.remove('good','bad')); b.classList.add(ok ? 'good' : 'bad'); fb.className = 'fb ' + (ok ? 'ok' : 'ko'); fb.textContent = (ok ? '✔ Oui ! ' : '✘ Pas tout à fait. ') + why; };
  btns = shuffled(opts, hashStr(sec.id) + 3).map(o => h('button', {type:'button', class:'chb', onclick:e => pick(o, e.currentTarget)}, o));
  return h('div', {class:'mini'}, h('b', null, '✏️ À toi, pour essayer (pas noté)'), h('p', {class:'qtxt'}, q), h('div', {class:'chg' + (opts.some(o => o.length > 16) ? ' long' : '')}, btns), fb);
}
function lessonCard(sec){

    h('div', {class:'lb'},
      L.rules.map(r => h('p', {class:'rule'}, rich(r))),
      L.table ? h('div', {class:'tblwrap'}, h('table', {class:'tbl'}, h('tr', null, L.table.head.map(x => h('th', null, x))), L.table.rows.map(r => h('tr', {class:regCls(r[0])}, r.map(c => h('td', null, rich(c))))))) : null,
      L.ba ? h('div', null, h('h4', {class:'h4s'}, 'Avant → après : comment faire ?'), h('div', {class:'ba'}, L.ba.map(([a, b]) => h('div', {class:'bapair'}, h('div', {class:'bub bef'}, h('span', {class:'lab'}, 'Avant'), a), h('div', {class:'arr', 'aria-hidden':'true'}, '→'), h('div', {class:'bub aft'}, h('span', {class:'lab'}, 'Après'), b))))) : null,
      L.examples ? h('div', {class:'ex'}, L.examples.map(([t, n]) => h('div', {class:'row'}, h('span', {class:'tx'}, t), h('span', {class:'note'}, n)))) : null,
      L.mail ? h('div', null, h('h4', {class:'h4s'}, L.modelTitle || 'Un mail modèle'), h('div', {class:'letter'}, rich(L.mail))) : null,
      L.checklist ? h('div', null, h('h4', {class:'h4s'}, 'Ma check-list avant d\'envoyer'), h('ul', {class:'check'}, L.checklist.map(c => h('li', null, rich(c))))) : null,
      miniEx(sec)));
}
// description lisible d'un QCM / d'un texte à trous (pour le suivi)
const fill = (txt, v) => txt.includes('___') ? txt.replace('___', '[' + v + ']') : txt + ' → ' + v;
// prend les exercices des leçons choisies, à tour de rôle (au plus cap éléments)
function interleave(lists, cap){ const out = []; for(let i = 0; out.length < cap; i++){ let any = false; for(const l of lists){ if(l[i] !== undefined){ any = true; out.push(l[i]); if(out.length >= cap) break; } } if(!any) break; } return out; }
function levelTabs(k, redraw){
  const tg = {A:'QCM', B:'je complète', C:'j\'écris'};
  return h('div', {class:'tabs'}, ['A','B','C'].map(L => { const open = levelOpen(k, L), ok = levelDone(k, L);
    return h('button', {type:'button', class:'tab' + (curLevel === L ? ' active' : '') + (ok ? ' okd' : ''), disabled:!open, title:open ? '' : 'Termine d\'abord le round précédent', onclick:() => { if(!open) return; curLevel = L; redraw(); }},
      (open ? '' : '🔒 ') + 'Round ' + L, h('small', null, ok ? '✓ fait' : levelFailed(k, L) ? '🔁 à refaire' : open ? tg[L] : 'verrouillé')); }));
}

function figure(key, showTitle){
  const im = key && D.IMAGES && D.IMAGES[key]; if(!im) return null;
  if(!im.src) return h('figure', {class:'fig slot'}, h('div', {class:'ph'}, '🖼️ ' + im.todo));
  return h('figure', {class:'fig'}, h('img', {src:im.src, alt:im.alt || im.title, loading:'lazy'}), showTitle ? h('figcaption', null, im.title) : null);
}
const imgFacts = key => { const im = key && D.IMAGES && D.IMAGES[key]; return im && im.facts ? im.facts : ''; };

/* ---- round C : texte à écrire (un morceau du mail, ou le mail complet assemblé) ---- */
// meilleur texte écrit au round C d'une étape : le parcours demandé s'il est réussi, sinon un autre parcours réussi, sinon n'importe quel texte
function bestC(k, pref){
  const order = (pref ? [pref] : []).concat(varList(k, 'C').filter(v => v !== pref));
  const got = order.map(v => ({v, st:STATE[qid(k, 'C', v)]})).filter(x => x.st && x.st.answer);
  return got.find(x => x.st.done && x.st.correct !== false) || got[0] || null;
}
function pieceText(k, pref, strict){
  const b = bestC(k, pref); if(!b || (strict && b.v !== pref)) return '';
  const st = b.st;
  // si le texte n'a pas été réussi après 2 essais, on part de la version à retenir
  const t = (st.correct === false && st.extra && st.extra.corrected) ? st.extra.corrected : st.answer;
  return String(t).split(/\n\n\[Bonus /)[0];
}
// morceau d'écriture littéraire d'une leçon (id de section) : écrit dans le round C de son étape
function litPart(k, secId, pref){
  const sec = stepOf(k).secs.find(x => x.id === secId), b = bestC(k, pref), st = b && b.st;
  if(!sec || !sec.lit || !st || !st.answer) return '';
  const m = String(st.answer).split('[Bonus littéraire : ' + sec.lit.label + ']\n')[1];
  return m ? m.split(/\n\n\[Bonus /)[0].trim() : '';
}
function assembleStory(v, c){
  const ph = t => '[À écrire : ' + t + ']';
  const lines = [ litPart('comment', 'sChamp', v) || ph('le lieu de ta scène'), litPart('mots', 'sDescr', v) || ph('une description avec deux sens'), litPart('aqui', 'sTemps', v) || ph('le décor et une action soudaine'),
    litPart('mots', 'sEmo', v) || ph('une émotion précise'), (litPart('mots', 'sFig', v).split('\n')[0]) || ph('une phrase avec une figure de style') ];
  return (c && c.storyStart ? [c.storyStart] : []).concat(lines).join('\n');
}
function assembleArg(v){
  return [ '[À écrire : ta thèse, c\'est-à-dire ton avis]', pieceText('argu', v, true) || '[À écrire : ton premier argument, avec une explication et un exemple]',
    '[À écrire : ton deuxième argument]', '[À écrire : une concession : Certes… mais…]', '[À écrire : ta conclusion]' ].join('\n\n');
}
function splitFrame(txt){ const m = String(txt || '').match(/DÉBUT DU MAIL :\n([\s\S]*?)\n\nFIN DU MAIL :\n([\s\S]*)/); return m ? {debut:m[1].trim(), fin:m[2].trim()} : {debut:'', fin:''}; }
function assembleMail(v, c){
  const fr = splitFrame(pieceText('travail', v));
  const blocks = [
    fr.debut || (c && c.mailStart) || '[À écrire : l\'objet du mail]\n\n[À écrire : la formule d\'appel]',
    pieceText('comment', v) || '[À écrire : ta présentation]',
    pieceText('aqui', v) || '[À écrire : ta demande de stage]',
    pieceText('mots', v) || '[À écrire : pourquoi ce métier t\'intéresse]',
    fr.fin || '[À écrire : la formule de politesse]\n\n[À écrire : ta signature]' ];
  return blocks.join('\n\n');
}
function roundC(k, q, v, redraw){
  const s = stepOf(k), c = cOf(s, v), extraCrit = secsFor(k).filter(x => !x.lit).map(x => x.crit).filter(Boolean);
  const rubric = c.rubric + (c.img ? ' DESCRIPTION DE L\'IMAGE (tu ne la vois pas ; sers-toi de cette description pour vérifier que l\'élève décrit ce qui est visible et n\'invente rien) : ' + imgFacts(c.img) : '') + (extraCrit.length ? ' CRITÈRES SUPPLÉMENTAIRES (leçons choisies par l\'élève, à vérifier aussi) : ' + extraCrit.join(' ') : '');
  const mk = (ph, rows, id) => { const ta = taNode(rows, ph, getDraft(id)); ta.addEventListener('input', () => setDraft(id, ta.value)); return ta; };
  const common = { q, title:c.title, instruct:'', rubric, minWords:c.minWords, system:SYS[c.sys] || SYSTEM_STEP, onDone:() => redraw() };
  if(s.final){
    const kind = s.kind || 'mail', prefill = kind === 'story' ? assembleStory(v, c) : kind === 'arg' ? assembleArg(v) : assembleMail(v, c);
    const ta = taNode(kind === 'mail' ? 22 : 14, c.ph, getDraft(q.id) || prefill); ta.addEventListener('input', () => setDraft(q.id, ta.value === prefill ? '' : ta.value));
    const plans = { story:['Le plan de ton récit : ', c.planTxt || 'lieu · description · action · émotion · figure de style.'], arg:['Le plan de ton texte : ', c.planTxt || 'thèse · argument 1 · argument 2 · concession (certes… mais…) · conclusion.'],
      mail:['Le plan de ton mail : ', c.planTxt || 'objet · formule d\'appel · présentation · demande · motivation · formule de politesse · signature.'] };
    const plan = h('div', {class:'plan5'}, h('b', null, plans[kind][0]), plans[kind][1]);
    return aiCard(Object.assign(common, { system:{story:SYSTEM_STORY, arg:SYSTEM_ARGFIN, mail:SYSTEM_FINAL}[kind], node:h('div', null, h('p', {class:'qtxt', style:'font-weight:500'}, rich(c.instruct)), plan, ta), getText:() => ta.value.trim(), setDisabled:v => ta.disabled = v,
      guard:text => /\[[^\]\n]*\]/.test(text) ? 'Il reste des [crochets] : remplace-les par ton texte.' : (((c.must || []).find(m => !new RegExp(m[0], 'i').test(text)) || [])[1]) || (norm(text) === norm(prefill) ? 'Ton texte est identique à celui des étapes précédentes. Relis-le, relie les morceaux et corrige les fautes avant de vérifier.' : null) }));
  }
  if(c.two){
    const t1 = mk(c.ph, 4, q.id + '-1'), t2 = mk(c.ph2, 4, q.id + '-2');
    return aiCard(Object.assign(common, { node:h('div', null, h('p', {class:'qtxt', style:'font-weight:500'}, rich(c.instruct)),
      h('div', {class:'fld'}, h('label', null, '1. Le début du mail (objet + formule d\'appel)'), t1), h('div', {class:'fld'}, h('label', null, '2. La fin du mail (formule de politesse + signature)'), t2)),
      getText:() => (t1.value.trim() && t2.value.trim()) ? 'DÉBUT DU MAIL :\n' + t1.value.trim() + '\n\nFIN DU MAIL :\n' + t2.value.trim() : '', setDisabled:v => { t1.disabled = v; t2.disabled = v; } }));
  }
  const ta = mk(c.ph, 6, q.id);
  const fig = figure(c.img, true), fiche = c.fiche ? h('div', {class:'fiche'}, h('b', {class:'fh'}, '🪪 Fiche d\'identité'), rich(c.fiche)) : null;
  const head = [h('p', {class:'qtxt', style:'font-weight:500'}, rich(c.instruct))];
  const bonus = secsFor(k).filter(x => x.lit).map(y => varOf(y, v)).map(x => ({id:x.id, tag:'littéraire', icon:'🎭', label:x.lit.label, instruct:x.lit.instruct, ph:x.lit.ph, rubric:x.lit.rubric, img:null}));
  if(c.slotBonus && D.IMAGES[c.slotBonus.slot] && D.IMAGES[c.slotBonus.slot].src) bonus.push({id:'slot-' + c.slotBonus.slot, tag:'image', icon:'🖼️', label:c.slotBonus.label, instruct:c.slotBonus.instruct, ph:c.slotBonus.ph, rubric:c.slotBonus.rubric + ' DESCRIPTION DE L\'IMAGE : non fournie (tu ne la vois pas).', img:c.slotBonus.slot});
  const top = [fig, fiche].filter(Boolean);
  if(bonus.length){
    const bt = bonus.map(x => ({x, ta:mk(x.ph, 3, q.id + '-lit-' + x.id)}));
    const brub = ' BLOCS BONUS (à la suite du texte principal, chacun commence par son titre entre crochets) : ' + bonus.map(x => '[Bonus ' + x.tag + ' : ' + x.label + '] → ' + x.rubric).join(' ') + ' ok = true seulement si le texte principal ET tous les blocs bonus sont réussis.';
    return aiCard(Object.assign(common, { rubric:rubric + brub, node:h('div', null, ...top, ...head, ta,
      ...bt.map(l => h('div', {class:'lit-fld'}, h('label', null, l.x.icon + ' Bonus ' + l.x.tag + ' : ' + l.x.label), figure(l.x.img, true), h('p', null, rich(l.x.instruct)), l.ta))),
      getText:() => { const m = ta.value.trim(); return m ? m + bt.map(l => '\n\n[Bonus ' + l.x.tag + ' : ' + l.x.label + ']\n' + l.ta.value.trim()).join('') : ''; },
      guard:() => { if(words(ta.value) < c.minWords) return 'Ton texte est un peu court : ajoute encore une phrase 🙂'; const e = bt.find(l => words(l.ta.value) < 4); return e ? 'N\'oublie pas ton bonus : « ' + e.x.label + ' » (au moins une phrase).' : null; },
      setDisabled:v => { ta.disabled = v; bt.forEach(l => l.ta.disabled = v); } }));
  }
  return aiCard(Object.assign(common, { node:h('div', null, ...top, ...head, ta), getText:() => ta.value.trim(), setDisabled:v => ta.disabled = v }));
}

function viewStep(k, body){
  const s = stepOf(k), n0 = stepNo(k), seed = hashStr(k), secs = secsFor(k), cap = s.final ? 9 : 6;
  body.append(h('div', {class:'sech', style:'margin-top:8px'}, h('h3', null, 'Leçon' + (secs.length > 1 ? 's' : ''))), ...secs.map(lessonCard));
  const tabsHost = h('div'); body.append(tabsHost);
  const host = h('div'); body.append(host);
  const draw = () => {
    if(!levelOpen(k, curLevel)) curLevel = ['A','B','C'].find(L => !levelDone(k, L) && levelOpen(k, L)) || 'A';
    const cv = curVar(k, curLevel), nv = nVar(k, curLevel), vseed = cv === 1 ? seed : hashStr(k + '#' + cv);
    const q = {id:qid(k, curLevel, cv), step:n0, level:curLevel, variant:cv, prompt:C.steps[n0 - 1].levels[curLevel].qs[cv - 1].prompt};
    let card, reps, tag;
    if(curLevel === 'A'){
      const raw = interleave(secs.map(x => varOf(x, cv).A.map((a, i) => Object.assign({sid:x.id, i}, a))), cap);
      const items = raw.map(a => ({q:a.q, img:a.img, opts:shuffled(a.opts, vseed + hashStr(a.sid) + a.i * 17), exp:a.opts[a.ans]}));
      reps = items.length; tag = 'QCM';
      card = detCard(q, 'Choisis la bonne réponse', '', selects => h('div', null, items.map((it, i) => { const sel = mkChoice(it.opts); selects.push(sel);
        const parts = it.q.split('___'); return h('div', {class:'sentline'}, figure(it.img, false), h('div', {class:'qtxt'}, h('span', {class:'rep'}, String(i + 1)), parts.length > 1 ? [parts[0], h('span', {class:'blank'}), parts[1]] : it.q), sel); })),
        items.map(i => i.exp), vals => vals.map((v, i) => (i + 1) + '. ' + fill(items[i].q, v)).join('\n'), () => draw());
    } else if(curLevel === 'B'){
      const lines = interleave(secs.map(x => { const y = varOf(x, cv); return y.B.lines.map(l => ({t:l[0], a:l[1], img:l[2], extra:y.B.extra || []})); }), cap);
      const seen = new Set(), pool = [];
      lines.forEach(l => [l.a].concat(l.extra).forEach(w => { const key = w.toLowerCase(); if(!seen.has(key)){ seen.add(key); pool.push(w); } }));
      const list = shuffled(pool, vseed + 5), ans = lines.map(l => l.a), dup = ans.length !== new Set(ans.map(a => a.toLowerCase())).size;
      reps = lines.length; tag = 'La liste de mots';
      card = detCard(q, 'Complète avec la liste de mots', '', selects => h('div', null,
        h('div', {class:'frames'}, h('b', null, 'La liste de mots'), h('div', {class:'wlist'}, list.map(w => h('span', null, w))), dup ? h('div', {class:'note'}, 'Un mot peut servir plusieurs fois.') : null),
        lines.map((l, i) => { const sel = mkSelect(list); selects.push(sel); const parts = l.t.split('___'); return h('div', {class:'sentline'}, figure(l.img, false), h('span', {class:'rep'}, String(i + 1)), parts[0], sel, parts[1] || ''); })),
        ans, vals => vals.map((v, i) => (i + 1) + '. ' + lines[i].t.replace('___', v)).join('\n'), () => draw());
    } else {
      reps = '1 texte'; tag = s.C.piece;
      card = roundC(k, q, cv, draw);
    }
    const failed = vFail(k, curLevel, cv), passed = vPass(k, curLevel, cv), nextLvl = ['A','B','C'].find(L => !levelDone(k, L) && levelOpen(k, L));
    const P = progKeys(), idx = P.indexOf(k), lastPt = idx >= P.length - 1;
    const nextStepBtn = lastPt ? h('button', {class:'btn coral', type:'button', onclick:() => renderHome()}, 'Terminer ✉️') : h('button', {class:'btn coral', type:'button', onclick:() => renderStep(P[idx + 1])}, 'Étape suivante →');
    const goVar = t => { if(vPass(k, curLevel, t) || vFail(k, curLevel, t)) resetLevel(k, curLevel, t); setVar(k, curLevel, t); draw(); window.scrollTo(0, 0); };
    const newBtn = cls => nv > 1 ? h('button', {class:'btn ' + cls, type:'button', onclick:() => goVar(nextVariant(k, curLevel))}, '🆕 Refaire avec de nouveaux exercices') : null;
    const choice = failed ? h('div', {class:'lvlnext lvlfail'}, h('b', null, '😕 ' + (nv > 1 ? 'Parcours ' + cv + ' : pas assez réussi' : 'Round ' + curLevel + ' : pas assez réussi')),
      h('div', null, levelDone(k, curLevel) ? 'Pas grave : ce round est déjà validé grâce à un autre parcours. Tu peux retenter pour t\'entraîner.' : 'Pas grave ! Relis la correction ci-dessus, puis refais le round pour le valider.'),
      h('div', {class:'lvlnext-btns'}, newBtn(''), h('button', {class:'btn' + (nv > 1 ? ' ghost' : ''), type:'button', onclick:() => { resetLevel(k, curLevel, cv); draw(); window.scrollTo(0, 0); }}, '🔁 Refaire ce round' + (nv > 1 ? ' (mêmes exercices)' : '')))) :
      passed ? h('div', {class:'lvlnext'}, h('b', null, '💪 Round ' + curLevel + ' terminé !'),
        stepDone(k) ? h('div', null, 'Les 3 rounds sont faits : l\'étape est validée.') : h('div', null, 'Il te reste le round ' + ['A','B','C'].filter(L => !levelDone(k, L)).join(' et ') + '.'),
        h('div', {class:'lvlnext-btns'}, stepDone(k) ? nextStepBtn : (nextLvl ? h('button', {class:'btn', type:'button', onclick:() => { curLevel = nextLvl; draw(); window.scrollTo(0, 0); }}, 'Round ' + nextLvl + ' →') : null), newBtn('ghost'))) : null;
    const vtabs = nv > 1 ? h('div', {class:'vtabs', role:'tablist', 'aria-label':'Parcours'}, h('span', {class:'vl'}, 'Parcours'), ...varList(k, curLevel).map(v => h('button', {type:'button', class:'vt' + (v === cv ? ' active' : '') + (vPass(k, curLevel, v) ? ' okd' : ''), role:'tab', 'aria-selected':v === cv ? 'true' : 'false', title:'Parcours ' + v + (vPass(k, curLevel, v) ? ' (réussi)' : vFail(k, curLevel, v) ? ' (à refaire)' : ''), onclick:() => { if(v === cv) return; setVar(k, curLevel, v); draw(); }}, String(v) + (vPass(k, curLevel, v) ? ' ✓' : vFail(k, curLevel, v) ? ' ↻' : '')))) : null;
    tabsHost.replaceChildren(levelTabs(k, draw));
    host.replaceChildren(h('div', {class:'lvl ' + curLevel}, h('div', {class:'lvl-head'}, h('h2', null, 'Round ' + curLevel), h('span', {class:'chip'}, reps + (typeof reps === 'number' ? ' questions' : '')), h('span', {class:'tag'}, tag), nv > 1 ? h('span', {class:'chip vlab'}, 'Parcours ' + cv + '/' + nv) : null), h('div', {class:'lvl-body'}, vtabs, card)), choice);
    updateChrome();
  };
  draw();
}

(async function init(){
  const saved = loadId();
  if(saved){
    ID = saved; await loadProgress();
    app.replaceChildren(testBanner(), cover(), h('div', {class:'poster', style:'margin-top:22px'}, h('div', {class:'body'},
      h('h2', null, 'Re-bonjour ' + saved.first + ' !'), h('p', {class:'sub'}, saved.classe + " — on reprend là où tu t'étais arrêté.e ?"),
      h('button', {class:'btn block', type:'button', onclick:() => enter()}, 'Reprendre'),
      h('button', {class:'btn ghost block', type:'button', style:'margin-top:10px', onclick:() => renderIdentify()}, "Ce n'est pas moi"))));
  } else renderIdentify();
})();
