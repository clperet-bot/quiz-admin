const both = rest => ['I am ' + rest, "I'm " + rest];
// [titre, consigne EN, consigne FR, questions [intitulé, réponses acceptées]]
const PARTS = [
 ['1 · Vocabulary','Write the English words.','Écris les mots en anglais.',[
   ['abîmé',['damaged']],['serrer',['to tighten','tighten']],['le fusible',['fuse','the fuse','a fuse']],['desserré',['loose']],
   ['vérifier',['to check','check']],['les fils',['wires','the wires']],['le dépannage',['troubleshooting','the troubleshooting']]]],
 ['2 · Complete','Complete the sentences with the verb. These actions are happening now.','Complète les phrases avec le verbe. Les actions se passent en ce moment.',[
   ['He ___ the door. (close)',['is closing']],['We ___ the machine. (repair)',['are repairing']],['I ___ the power. (turn off)',['am turning off',"'m turning off"]],
   ['They ___ a tool. (use)',['are using']],['She ___ the lamp. (replace)',['is replacing']]]],
 ['3 · The photo','Look at the photo. Write the name of each object.','Regarde la photo. Écris le nom de chaque objet.',[
   ['A',['screwdriver','a screwdriver']],['B',['contactor','a contactor']],['C',['gloves']],['D',['pliers']]]],
 ['4 · Write the sentences','Write the sentence in English. Use the tense for an action happening as you speak.','Écris la phrase en anglais. Utilise le temps adapté à une action qui se passe au moment où on la dit.',[
   ['J\'ouvre le capot.',both('opening the cover')],['La machine ne démarre pas.',['The machine does not start',"The machine doesn't start",'The machine is not starting',"The machine isn't starting"]],
   ['J\'appuie sur le bouton de démarrage.',both('pressing the start button')],['Je porte des gants.',both('wearing gloves')]]]
];
const questions = PARTS.flatMap(p => p[3]);
const set = { title:"Electrician's Guide — Test" };
const app = document.getElementById('app');
let finished = false;

function normalizeName(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean = s => s.replace(/[<>&"]/g,'').trim().slice(0,60);

// Réponses telles qu'elles sont saisies (aussi enregistrées si la tentative est annulée)
function collect(){
  return questions.map((q, i) => {
    const el = document.getElementById('w' + i);
    const answer = clean(el ? el.value : '');
    const status = vocabGrade(answer, q[1]);
    return { type:'vocab', set:setKey, idx:i, label:q[0], answer, correct_answer:q[1][0], status, points:1,
             correct: status === 'ok', score: status === 'ok' ? 1 : 0,
             comment: status === 'review' ? 'À vérifier (une faute d\'écart)' : '' };
  });
}
let answersDetail = [];

function attemptRow(extra){
  return Object.assign({ quiz_id:quizId, class_id:classId, student_name_raw:studentName,
    student_name_normalized:normalizeName(studentName) }, extra);
}

// ============ EMPÊCHE LA MISE EN VEILLE DE L'ÉCRAN PENDANT LE QUIZ ============
// (une mise en veille déclenche le même événement qu'un changement d'onglet et
// pouvait à tort annuler la tentative d'un élève — voir anti-triche ci-dessous)
let wakeLock = null;
async function requestWakeLock(){
  try{
    if('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch(e){ /* pas supporté ou refusé : tant pis, le reste du système reste fonctionnel */ }
}
if(studentName && classId && quizId && set){
  requestWakeLock();
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && !wakeLock) requestWakeLock();
  });
}

let cheatTriggered = false;
let awayTimer = null;
document.addEventListener('visibilitychange', () => {
  if(cheatTriggered || finished || !set) return;
  windowBlurTimer = null; // un changement de visibilité remplace tout blur en cours (évite un double décompte)
  if(document.hidden){
    awayTimer = Date.now();
  } else if(awayTimer){
    const awaySeconds = (Date.now() - awayTimer) / 1000;
    awayTimer = null;
    if(awaySeconds > 5){
      cheatTriggered = true;
      cancelAttempt();
    } else {
      document.getElementById('cheat-banner').textContent = "⚠ Tu es sorti(e) du quiz. Si tu recommences, tes réponses seront effacées et ta prof sera notifiée.";
    }
  }
});

// Détection complémentaire : en écran partagé (deux fenêtres/apps côte à côte), la page du
// quiz reste "visible" au sens de visibilitychange même quand l'élève clique dans l'autre
// fenêtre pour taper/chercher quelque chose — seul le focus de la fenêtre change. On surveille
// donc aussi blur/focus de la fenêtre, avec la même règle (plus de 5 secondes ailleurs = annulée).
// Sur téléphone (iPhone/Android) il n'y a pas d'écran partagé : les événements blur/focus de la fenêtre y sont
// déclenchés à tort (clavier, correcteur, menu copier-coller, centre de notifications...) et sont parfois perdus
// au retour, ce qui annulait des copies sans que l'élève soit sorti. Sur téléphone on ne garde donc que
// visibilitychange (changement d'appli ou d'onglet, verrouillage de l'écran).
const IS_PHONE = /iPhone|iPod|Android.*Mobile/i.test(navigator.userAgent || '');
let windowBlurTimer = null;
window.addEventListener('blur', () => {
  if(IS_PHONE || finished || cheatTriggered || document.hidden) return;
  windowBlurTimer = Date.now();
});
window.addEventListener('focus', () => {
  if(IS_PHONE || finished || cheatTriggered || !windowBlurTimer) return;
  const awaySeconds = (Date.now() - windowBlurTimer) / 1000;
  windowBlurTimer = null;
  if(awaySeconds > 5){
    cheatTriggered = true;
    cancelAttempt();
  } else {
    document.getElementById('cheat-banner').textContent = "⚠ Tu as quitté la fenêtre du quiz (écran partagé/autre appli). Si tu recommences, tes réponses seront effacées et ta prof sera notifiée.";
  }
});

async function cancelAttempt(){
  if(finished) return;
  finished = true;
  answersDetail = collect();
  app.innerHTML = '<div class="card">Tentative annulée : tu as quitté le quiz. Ta prof a été notifiée. Reviens demain pour réessayer.</div>';
  try{ await supa.from('attempts').insert(attemptRow({ score:null, total:null, cancelled:true, answers_detail:answersDetail })); } catch(e){}
}

function render(){
  let n = 0, html = '<h1>' + esc(set.title) + '</h1>';
  PARTS.forEach((p, k) => {
    html += '<h2>' + p[0] + '</h2><div class="card">' + p[1] + '<div class="fr">' + p[2] + '</div></div>';
    if(k === 2) html += '<img src="' + PHOTO + '" alt="Photo : quatre objets repérés par les lettres A à D">';
    p[3].forEach(q => {
      html += '<div class="card"><label class="row" for="w' + n + '"><span class="num">' + (n+1) + '</span>' + esc(q[0]) + '</label>' +
        '<input id="w' + n + '" type="text" maxlength="60" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" lang="en"></div>';
      n++;
    });
  });
  app.innerHTML = html + '<button id="send">Envoyer mes réponses</button><p id="msg" class="fr"></p>';
  const btn = document.getElementById('send');
  const msg = document.getElementById('msg');
  let confirmedEmpty = false;
  btn.addEventListener('click', async () => {
    if(finished) return;
    answersDetail = collect();
    const empty = answersDetail.filter(a => !a.answer).length;
    if(empty && !confirmedEmpty){
      confirmedEmpty = true;
      msg.textContent = 'Il reste ' + empty + ' réponse(s) vide(s). Appuie encore une fois pour envoyer quand même.';
      return;
    }
    btn.disabled = true; msg.textContent = 'Envoi...';
    const score = answersDetail.reduce((n, a) => n + a.score, 0);
    let saved = false, hidden = true;
    try{
      const { error } = await supa.from('attempts').insert(attemptRow({ score, total:20, cancelled:false, answers_detail:answersDetail }));
      saved = !error;
    } catch(e){}
    if(!saved){ btn.disabled = false; msg.textContent = "L'envoi a échoué. Vérifie ta connexion et appuie encore."; return; }
    finished = true;
    document.getElementById('cheat-banner').classList.remove('show');
    try{
      const { data } = await supa.from('classes').select('slug').eq('id', classId).maybeSingle();
      hidden = !data || data.slug === '2ndeTNE';
    } catch(e){}
    showResult(score, hidden);
    window.scrollTo(0, 0);
  });
}

// Les bonnes réponses ne sont pas affichées : le quiz peut être refait un autre jour.
function showResult(score, hidden){
  if(hidden){
    app.innerHTML = '<h1>' + esc(set.title) + '</h1><div class="card">Réponses envoyées. Ta note est en attente de validation.</div>';
    return;
  }
  const pending = answersDetail.some(a => a.status === 'review');
  const names = { ok:'Juste', review:'À vérifier', no:'Faux' };
  app.innerHTML = '<h1>' + esc(set.title) + '</h1><div class="card"><div class="big">' + score + ' / 20</div>' +
    (pending ? '<div class="fr">Note provisoire : ta prof doit vérifier certaines réponses.</div>' : '') + '</div>' +
    answersDetail.map(a => '<div class="card"><div class="row"><span class="num">' + (a.idx+1) + '</span>' + esc(a.label) + '</div>' +
      (esc(a.answer) || '<span class="fr">(vide)</span>') + ' — <span class="tag ' + a.status + '">' + names[a.status] + '</span></div>').join('');
}

if(!studentName || !classId || !quizId || !set){
  app.innerHTML = '<div class="card">Accède à ce quiz avec le QR code de ta classe.</div>';
} else {
  document.getElementById('cheat-banner').classList.add('show');
  render();
}
</script>
